<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irányítópult — Cégfókusz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4fb; --surface: #ffffff; --ink: #1a1b2e; --ink-soft: #6b7089;
    --line: #eaeaf3; --primary: #4f46e5;
    --ok: #16a34a; --ok-bg: #f0fdf4;
    --error: #dc2626; --error-bg: #fef2f2;
    --warn: #d97706; --warn-bg: #fffbeb;
    --missing: #6b7089; --missing-bg: #f3f4f6;
    --shadow: 0 1px 2px rgba(23,23,60,0.04), 0 6px 20px rgba(23,23,60,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

  .topnav { background: var(--surface); border-bottom: 1px solid var(--line); }
  .topnav-inner { max-width: 680px; margin: 0 auto; padding: 0.9rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
  .topnav .brand { display: flex; align-items: center; gap: 0.4rem; }
  .topnav .brand img { width: 38px; height: 38px; }
  .topnav .brand-name { font-weight: 700; font-size: 0.95rem; }
  .topnav .nav-links { display: flex; align-items: center; gap: 1.1rem; }
  .topnav .nav-links a, .topnav .nav-links button {
    font-family: "Inter", sans-serif; font-size: 0.85rem; color: var(--ink-soft); text-decoration: none;
    background: none; border: none; cursor: pointer; padding: 0;
  }
  .topnav .nav-links a.active { color: var(--primary); font-weight: 600; }
  .topnav .nav-links button:hover { color: var(--error); }

  .wrap { max-width: 680px; margin: 0 auto; padding: 1.8rem 1.25rem 4rem; }
  .company-header { margin-bottom: 1.5rem; }
  .company-header h1 { font-size: 1.3rem; margin: 0 0 0.2rem; }
  .company-header .sub { font-size: 0.85rem; color: var(--ink-soft); }

  .section-title { font-size: 0.95rem; font-weight: 700; margin: 1.8rem 0 0.8rem; }
  .section-title:first-of-type { margin-top: 0; }

  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 1.3rem 1.4rem; margin-bottom: 1rem; }

  .source-row { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.8rem; padding: 0.55rem 0; border-top: 1px solid var(--line); align-items: baseline; }
  .source-row:first-of-type { border-top: none; }
  .source-name { font-size: 0.85rem; color: var(--ink-soft); grid-column: 1; }
  .source-status { font-size: 0.8rem; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 999px; grid-column: 2; white-space: nowrap; }
  .source-detail { grid-column: 1 / -1; font-size: 0.75rem; color: var(--ink-soft); }
  .status-ok { background: var(--ok-bg); color: var(--ok); }
  .status-error { background: var(--error-bg); color: var(--error); }
  .status-stale { background: var(--warn-bg); color: var(--warn); }
  .status-missing { background: var(--missing-bg); color: var(--missing); }

  .threshold-row { margin-bottom: 1rem; }
  .threshold-row:last-child { margin-bottom: 0; }
  .threshold-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; }
  .threshold-numbers { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.4rem; }
  .bar-track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-ok { background: var(--ok); }
  .bar-warn { background: var(--warn); }
  .bar-over { background: var(--error); }
  .no-threshold { font-size: 0.82rem; color: var(--ink-soft); }

  .vat-hero { border-radius: 20px; padding: 1.6rem 1.7rem; margin-bottom: 1.6rem; color: #fff; }
  .vat-payable { background: linear-gradient(135deg, #4338ca, #6d28d9); }
  .vat-refund { background: linear-gradient(135deg, #059669, #16a34a); }
  .vat-hero-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 0.4rem; }
  .vat-hero-amount { font-size: 2rem; font-weight: 800; margin-bottom: 1rem; }
  .vat-hero-breakdown { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; opacity: 0.92; }
  .vat-hero-breakdown .dot { display: inline-block; width: 7px; height: 7px; border-radius: 999px; margin-right: 0.4rem; background: rgba(255,255,255,0.7); }

  .vat-filter { display: flex; gap: 0.7rem; align-items: end; margin-bottom: 0.9rem; flex-wrap: wrap; }
  .vat-filter-group { display: flex; flex-direction: column; gap: 0.25rem; }
  .vat-filter-group label { font-size: 0.72rem; color: var(--ink-soft); font-weight: 600; }
  .vat-filter-group input {
    font-family: "Inter", sans-serif; font-size: 0.82rem; padding: 0.4rem 0.55rem;
    border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  .vat-filter-btn {
    font-family: "Inter", sans-serif; font-size: 0.82rem; font-weight: 700; padding: 0.45rem 1rem;
    border-radius: 8px; border: none; background: var(--primary); color: #fff; cursor: pointer;
  }
  .pdf-filter-btn {
    font-family: "Inter", sans-serif; font-size: 0.82rem; font-weight: 700; padding: 0.44rem 1rem;
    border-radius: 8px; border: 1.5px solid var(--primary); background: var(--surface); color: var(--primary); cursor: pointer;
  }
  .pdf-filter-btn:disabled { opacity: 0.55; cursor: default; }

  .payment-card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 1.3rem 1.4rem; margin-bottom: 1rem; }
  .payment-summary-text { font-size: 0.88rem; line-height: 1.6; margin-bottom: 0.9rem; }
  .payment-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; margin-bottom: 0.7rem; }
  .payment-bar-segment { height: 100%; }
  .payment-legend { display: flex; flex-direction: column; gap: 0.35rem; }
  .payment-legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
  .payment-legend-item .legend-label { display: flex; align-items: center; gap: 0.5rem; }
  .payment-legend-item .legend-dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }

  .loading, .empty-state { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="topnav">
    <div class="topnav-inner">
      <div class="brand">
        <img src="favicon.svg" alt="Cégfókusz">
        <div class="brand-name">Cégfókusz</div>
      </div>
      <div class="nav-links">
        <a href="dashboard.html" class="active">Irányítópult</a>
        <a href="adataim.html">Adataim</a>
        <a href="beallitasok.html">Beállítások</a>
        <button id="logoutBtn">Kijelentkezés</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="content" class="loading">Betöltés...</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SOURCE_LABELS = {
  opg: "Pénztárgép",
  invoice_inbound: "Bejövő számlák",
  invoice_outbound: "Kimenő számlák",
};

const THRESHOLDS = {
  kata: { label: "KATA (kisadózó)", limit: 18_000_000 },
  atalanyado: { label: "Átalányadó", limit: 38_736_000 },
  alanyi_mentes: { label: "Alanyi ÁFA-mentesség", limit: 20_000_000 },
};

function formatFt(n) {
  return Math.round(n).toLocaleString("hu-HU") + " Ft";
}

function formatDateTime(iso) {
  return new Date(iso).toLocaleString("hu-HU", { dateStyle: "short", timeStyle: "short" });
}

function hoursSince(iso) {
  return (Date.now() - new Date(iso).getTime()) / (1000 * 60 * 60);
}

function yearStartIso() {
  return new Date(Date.UTC(new Date().getUTCFullYear(), 0, 1)).toISOString();
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.href = "login.html";
});

async function renderStatusSection(companyId) {
  const since = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString();
  const { data: runs, error } = await sb
    .from("sync_runs")
    .select("source, run_at, items_found, error_message")
    .eq("company_id", companyId)
    .gte("run_at", since)
    .order("run_at", { ascending: false });
  if (error) throw error;

  const latestBySource = {};
  for (const run of runs ?? []) {
    if (!latestBySource[run.source]) latestBySource[run.source] = run;
  }

  const rows = Object.keys(SOURCE_LABELS)
    .map((source) => {
      const run = latestBySource[source];
      let statusClass = "status-missing";
      let statusText = "Nincs adat még";
      let detail = "";

      if (run) {
        const age = hoursSince(run.run_at);
        if (run.error_message) {
          statusClass = "status-error";
          statusText = "Hiba";
          detail = run.error_message;
        } else if (age > 30) {
          statusClass = "status-stale";
          statusText = "Elmaradt futás";
          detail = `Utolsó futás: ${formatDateTime(run.run_at)}`;
        } else {
          statusClass = "status-ok";
          statusText = "Rendben";
          detail = `${run.items_found ?? 0} tétel · utoljára: ${formatDateTime(run.run_at)}`;
        }
      }

      return `
      <div class="source-row">
        <div class="source-name">${SOURCE_LABELS[source]}</div>
        <div class="source-status ${statusClass}">${statusText}</div>
        <div class="source-detail">${detail}</div>
      </div>`;
    })
    .join("");

  return `<div class="card">${rows}</div>`;
}

async function computeVatSummary(companyId, fromIso, toIso) {
  const [{ data: outboundRows, error: e1 }, { data: inboundRows, error: e2 }, { data: opgRows, error: e3 }] = await Promise.all([
    sb.from("invoice_vat_lines").select("vat_amount").eq("company_id", companyId).eq("direction", "OUTBOUND").gte("issue_date", fromIso).lte("issue_date", toIso),
    sb.from("invoice_vat_lines").select("vat_amount").eq("company_id", companyId).eq("direction", "INBOUND").gte("issue_date", fromIso).lte("issue_date", toIso),
    sb.from("opg_receipt_items").select("vat_amount").eq("company_id", companyId).gte("transaction_at", fromIso).lte("transaction_at", toIso + "T23:59:59"),
  ]);
  if (e1 || e2 || e3) throw (e1 || e2 || e3);

  const sum = (rows) => (rows ?? []).reduce((s, r) => s + Number(r.vat_amount ?? 0), 0);
  const outboundVat = sum(outboundRows);
  const opgVat = sum(opgRows);
  const inboundVat = sum(inboundRows);
  const net = outboundVat + opgVat - inboundVat;
  return { outboundVat, opgVat, inboundVat, net };
}

function renderVatSummaryHtml(summary) {
  const isPayable = summary.net >= 0;
  return `
  <div class="vat-hero ${isPayable ? "vat-payable" : "vat-refund"}">
    <div class="vat-hero-label">${isPayable ? "Amit a kiválasztott időszakban be kellene fizetned" : "Amit a kiválasztott időszakban visszaigényelhetsz"}</div>
    <div class="vat-hero-amount">${formatFt(Math.abs(summary.net))}</div>
    <div class="vat-hero-breakdown">
      <div><span class="dot"></span>Kimenő számla ÁFA: ${formatFt(summary.outboundVat)}</div>
      <div><span class="dot"></span>Pénztárgép ÁFA: ${formatFt(summary.opgVat)}</div>
      <div><span class="dot"></span>Levonható (bejövő) ÁFA: ${formatFt(summary.inboundVat)}</div>
    </div>
  </div>`;
}

function defaultVatDates() {
  const now = new Date();
  const from = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)).toISOString().slice(0, 10);
  const to = now.toISOString().slice(0, 10);
  return { from, to };
}

const PAYMENT_COLORS = { "Bankkártya": "#4338ca", "Készpénz": "#16a34a", "Egyéb": "#d97706" };

async function computePaymentSummary(companyId, fromIso, toIso) {
  const { data, error } = await sb
    .from("opg_receipt_payments")
    .select("payment_type, amount")
    .eq("company_id", companyId)
    .gte("transaction_at", fromIso)
    .lte("transaction_at", toIso + "T23:59:59");
  if (error) throw error;

  const totals = { "Bankkártya": 0, "Készpénz": 0, "Egyéb": 0 };
  for (const row of data ?? []) {
    const key = row.payment_type === "Bankkártya" || row.payment_type === "Készpénz" ? row.payment_type : "Egyéb";
    totals[key] += Number(row.amount ?? 0);
  }
  return totals;
}

function renderPaymentSummaryHtml(totals) {
  const grandTotal = totals["Bankkártya"] + totals["Készpénz"] + totals["Egyéb"];

  if (grandTotal === 0) {
    return `<div class="payment-card"><div class="payment-summary-text">Nincs pénztárgépes forgalom a kiválasztott időszakban.</div></div>`;
  }

  const pct = (v) => Math.round((v / grandTotal) * 100);
  const cardPct = pct(totals["Bankkártya"]);
  const cashPct = pct(totals["Készpénz"]);

  const barSegments = Object.entries(totals)
    .filter(([, v]) => v > 0)
    .map(([type, v]) => `<div class="payment-bar-segment" style="width:${(v / grandTotal) * 100}%; background:${PAYMENT_COLORS[type]};"></div>`)
    .join("");

  const legendItems = Object.entries(totals)
    .filter(([, v]) => v > 0)
    .map(([type, v]) => `
      <div class="payment-legend-item">
        <div class="legend-label"><span class="legend-dot" style="background:${PAYMENT_COLORS[type]};"></span>${type}</div>
        <div>${formatFt(v)} (${pct(v)}%)</div>
      </div>`)
    .join("");

  return `
  <div class="payment-card">
    <div class="payment-summary-text">A bevételed <b>${cardPct}%-a kártyás</b>, <b>${cashPct}%-a készpénzes</b> volt ebben az időszakban — összesen ${formatFt(grandTotal)}.</div>
    <div class="payment-bar">${barSegments}</div>
    <div class="payment-legend">${legendItems}</div>
  </div>`;
}

async function computeThresholdChecks(company) {
  const from = yearStartIso();

  const { data: invoiceRows, error: invoiceError } = await sb
    .from("invoice_vat_lines")
    .select("net_amount")
    .eq("company_id", company.id)
    .eq("direction", "OUTBOUND")
    .gte("issue_date", from);
  if (invoiceError) throw invoiceError;

  const { data: opgRows, error: opgError } = await sb
    .from("opg_receipt_items")
    .select("net_amount")
    .eq("company_id", company.id)
    .gte("transaction_at", from);
  if (opgError) throw opgError;

  const invoiceTotal = (invoiceRows ?? []).reduce((s, r) => s + Number(r.net_amount ?? 0), 0);
  const opgTotal = (opgRows ?? []).reduce((s, r) => s + Number(r.net_amount ?? 0), 0);
  const revenue = invoiceTotal + opgTotal;

  const checks = [];
  if (company.tax_regime === "kata") checks.push({ ...THRESHOLDS.kata, revenue });
  if (company.tax_regime === "atalanyado") checks.push({ ...THRESHOLDS.atalanyado, revenue });
  if (company.alanyi_mentes) checks.push({ ...THRESHOLDS.alanyi_mentes, revenue });

  return checks;
}

function renderThresholdHtml(checks) {
  if (checks.length === 0) {
    return `<div class="card"><div class="no-threshold">Nincs beállított figyelendő bevételi küszöb (normál adózás, nem alanyi mentes).</div></div>`;
  }

  const rows = checks
    .map((c) => {
      const percent = (c.revenue / c.limit) * 100;
      const pct = Math.min(percent, 100);
      let barClass = "bar-ok";
      if (percent >= 100) barClass = "bar-over";
      else if (percent >= 80) barClass = "bar-warn";

      return `
      <div class="threshold-row">
        <div class="threshold-label">${c.label}</div>
        <div class="threshold-numbers">${formatFt(c.revenue)} / ${formatFt(c.limit)} (${percent.toFixed(1)}%)</div>
        <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${pct}%"></div></div>
      </div>`;
    })
    .join("");

  return `<div class="card">${rows}</div>`;
}

async function renderThresholdSection(company) {
  const checks = await computeThresholdChecks(company);
  return renderThresholdHtml(checks);
}

// --- PDF-jelentés ---
// A korábbi próbálkozások (jsPDF beépített helvetica betűtípusa, majd egyedi
// Inter TTF beágyazása) mindkettő a jsPDF saját, korlátozott szövegrenderelő
// motorján futottak: az egyik nem ismerte a magyar ő/ű-t, a másiknál a TTF
// glifák nem rajzolódtak ki helyesen. Ehelyett most a böngésző saját, valódi
// szövegrenderelését használjuk (doc.html() + html2canvas): egy, az oldallal
// megegyező stílusú, Inter betűtípusú HTML-sablont építünk fel, majd ezt a
// jsPDF pixelre pontosan PDF-be rendereli — így minden karakter és a
// betűköz is pontosan úgy néz ki, mint a képernyőn.
function renderReportHtml({ company, from, to, vatSummary, paymentSummary, thresholdChecks }) {
  const isPayable = vatSummary.net >= 0;
  const heroGradient = isPayable ? "linear-gradient(135deg,#4338ca,#6d28d9)" : "linear-gradient(135deg,#059669,#16a34a)";
  const grandTotal = paymentSummary["Bankkártya"] + paymentSummary["Készpénz"] + paymentSummary["Egyéb"];
  const paymentColors = { "Bankkártya": "#4338ca", "Készpénz": "#16a34a", "Egyéb": "#d97706" };
  const paymentKeys = ["Bankkártya", "Készpénz", "Egyéb"].filter((k) => paymentSummary[k] > 0);

  const paymentHtml = grandTotal === 0
    ? `<div style="font-size:13px;color:#6b7089;">Nincs pénztárgépes forgalom a kiválasztott időszakban.</div>`
    : `
      <div style="display:flex;height:12px;border-radius:999px;overflow:hidden;margin:10px 0 10px;">
        ${paymentKeys.map((k) => `<div style="width:${(paymentSummary[k] / grandTotal) * 100}%;background:${paymentColors[k]};"></div>`).join("")}
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;font-size:13px;">
        ${paymentKeys.map((k) => `
          <div style="display:flex;justify-content:space-between;">
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:${paymentColors[k]};margin-right:6px;"></span>${k}</span>
            <span>${formatFt(paymentSummary[k])} (${Math.round((paymentSummary[k] / grandTotal) * 100)}%)</span>
          </div>`).join("")}
      </div>`;

  const thresholdRowHtml = (c) => {
    const percent = (c.revenue / c.limit) * 100;
    const pct = Math.min(percent, 100);
    const barColor = percent >= 100 ? "#dc2626" : percent >= 80 ? "#d97706" : "#16a34a";
    return `
      <div style="font-size:13px;font-weight:600;margin-bottom:3px;">${c.label}</div>
      <div style="font-size:12px;color:#6b7089;margin-bottom:6px;">${formatFt(c.revenue)} / ${formatFt(c.limit)} (${percent.toFixed(1)}%)</div>
      <div style="height:6px;border-radius:999px;background:#eaeaf3;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${barColor};"></div></div>`;
  };

  // Minden szakasz (és minden küszöb-sor) egy-egy `data-pdf-block`
  // csomagolóban van — a PDF-tördelés csak blokk-határon vághat lapot,
  // így egy sor vagy szakasz sosem szakad ketté, és sosem duplázódik.
  const thresholdBlocksHtml = thresholdChecks.length === 0
    ? `<div data-pdf-block style="margin-bottom:14px;"><div style="font-size:13px;color:#6b7089;">Nincs beállított figyelendő bevételi küszöb (normál adózás, nem alanyi mentes).</div></div>`
    : thresholdChecks.map((c) => `<div data-pdf-block style="margin-bottom:14px;">${thresholdRowHtml(c)}</div>`).join("");

  return `
    <div style="font-family:'Inter',sans-serif;color:#1a1b2e;-webkit-font-smoothing:antialiased;">
      <div data-pdf-block>
        <div style="font-size:22px;font-weight:800;color:#4f46e5;margin-bottom:16px;">Cégfókusz — pénzügyi jelentés</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:4px;">${company.name}</div>
        <div style="font-size:12px;color:#6b7089;line-height:1.7;margin-bottom:20px;">
          Adószám: ${company.tax_number}<br>
          Időszak: ${from} – ${to}<br>
          Készült: ${new Date().toLocaleString("hu-HU", { dateStyle: "long", timeStyle: "short" })}
        </div>
        <div style="border-top:1px solid #eaeaf3;margin-bottom:20px;"></div>
      </div>

      <div data-pdf-block>
        <div style="font-size:16px;font-weight:700;margin-bottom:12px;">ÁFA-pozíció</div>
        <div style="border-radius:14px;padding:18px 20px;margin-bottom:16px;color:#fff;background:${heroGradient};">
          <div style="font-size:12px;opacity:0.92;margin-bottom:6px;">${isPayable ? "Befizetendő ÁFA a kiválasztott időszakban" : "Visszaigényelhető ÁFA a kiválasztott időszakban"}</div>
          <div style="font-size:24px;font-weight:800;">${formatFt(Math.abs(vatSummary.net))}</div>
        </div>
        <div style="font-size:13px;line-height:2;margin-bottom:20px;">
          Kimenő számla ÁFA: ${formatFt(vatSummary.outboundVat)}<br>
          Pénztárgép ÁFA: ${formatFt(vatSummary.opgVat)}<br>
          Levonható (bejövő) ÁFA: ${formatFt(vatSummary.inboundVat)}
        </div>
        <div style="border-top:1px solid #eaeaf3;margin-bottom:20px;"></div>
      </div>

      <div data-pdf-block>
        <div style="font-size:16px;font-weight:700;margin-bottom:12px;">Fizetési mód megoszlása</div>
        ${paymentHtml}
        <div style="border-top:1px solid #eaeaf3;margin:20px 0;"></div>
      </div>

      <div data-pdf-block style="margin-bottom:2px;">
        <div style="font-size:16px;font-weight:700;">Bevételi küszöbök (${new Date().getFullYear()})</div>
      </div>
      ${thresholdBlocksHtml}

      <div data-pdf-block>
        <div style="border-top:1px solid #eaeaf3;margin:8px 0 12px;"></div>
        <div style="font-size:11px;color:#6b7089;line-height:1.6;">
          Ez a jelentés tájékoztató jellegű, a Cégfókusz által szinkronizált NAV-adatok alapján készült — nem helyettesíti a könyvelői egyeztetést.
        </div>
      </div>
    </div>`;
}

async function buildReportPdf(data) {
  await document.fonts.ready;

  const container = document.createElement("div");
  container.style.cssText = "position:fixed; left:-10000px; top:0; width:686px; background:#ffffff; padding:32px;";
  container.innerHTML = renderReportHtml(data);
  document.body.appendChild(container);

  try {
    // Közvetlenül a html2canvas-t hívjuk, és a kapott raszterképet tesszük
    // be a PDF-be — a jsPDF saját .html() metódusa a szöveget a jsPDF
    // korlátozott, WinAnsi-kódolású betűtípusával próbálná "vektorosan"
    // újrarajzolni, ami visszahozná a magyar ő/ű hiányát. Így viszont
    // pixelpontosan azt kapjuk, amit a böngésző valóban megrajzolt.
    const blockOffsetsPx = Array.from(container.querySelectorAll("[data-pdf-block]")).map((el) => el.offsetTop);

    const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
    const canvasScale = canvas.width / container.offsetWidth;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const margin = 40;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const imgWidth = pageWidth - margin * 2;
    const pxToPt = imgWidth / canvas.width;
    const pageContentHeightPx = (pageHeight - margin * 2) / pxToPt;

    // A blokkhatárok (canvas-pixelben) jelölik ki, hol szabad lapot váltani —
    // soha nem egy sor vagy szakasz közepén, mindig a blokkok között.
    const breakPointsPx = blockOffsetsPx.map((top) => top * canvasScale);
    breakPointsPx.push(canvas.height);

    let sy = 0;
    let first = true;
    while (sy < canvas.height - 0.5) {
      let sliceEnd = canvas.height;
      for (const bp of breakPointsPx) {
        if (bp <= sy + 0.5) continue;
        if (bp - sy <= pageContentHeightPx) {
          sliceEnd = bp;
        } else {
          break;
        }
      }
      // Ha egyetlen blokk sem fér ki egy oldalon (nagyon magas blokk),
      // biztonságból egyszerűen levágjuk az oldal magasságánál.
      if (sliceEnd <= sy) sliceEnd = Math.min(sy + pageContentHeightPx, canvas.height);

      const sliceHeightPx = sliceEnd - sy;
      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeightPx;
      pageCanvas.getContext("2d").drawImage(canvas, 0, sy, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

      if (!first) doc.addPage();
      first = false;
      doc.addImage(pageCanvas.toDataURL("image/png"), "PNG", margin, margin, imgWidth, sliceHeightPx * pxToPt);

      sy = sliceEnd;
    }

    const safeFrom = data.from.replaceAll("-", "");
    const safeTo = data.to.replaceAll("-", "");
    doc.save(`cegfokusz-jelentes_${data.company.tax_number}_${safeFrom}-${safeTo}.pdf`);
  } finally {
    container.remove();
  }
}

async function main() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = "login.html";
    return;
  }

  const content = document.getElementById("content");

  const { data: companies, error: companyError } = await sb.from("companies").select("*");
  if (companyError) {
    content.innerHTML = `<div class="empty-state">Hiba történt az adatok betöltésekor: ${companyError.message}</div>`;
    return;
  }

  if (!companies || companies.length === 0) {
    content.innerHTML = `<div class="empty-state">A regisztrációdat még átnézzük és aktiváljuk — ez rövidesen megtörténik, addig itt még nincs mit mutatni.</div>`;
    return;
  }

  const company = companies[0];

  try {
    const { from: defFrom, to: defTo } = defaultVatDates();
    const [statusHtml, thresholdHtml, vatSummary, paymentSummary] = await Promise.all([
      renderStatusSection(company.id),
      renderThresholdSection(company),
      computeVatSummary(company.id, defFrom, defTo),
      computePaymentSummary(company.id, defFrom, defTo),
    ]);

    content.innerHTML = `
      <div class="company-header">
        <h1>${company.name}</h1>
        <div class="sub">Adószám: ${company.tax_number}</div>
      </div>

      <div class="vat-filter">
        <div class="vat-filter-group">
          <label>Ettől</label>
          <input type="date" id="vatFrom" value="${defFrom}">
        </div>
        <div class="vat-filter-group">
          <label>Eddig</label>
          <input type="date" id="vatTo" value="${defTo}">
        </div>
        <button class="vat-filter-btn" id="vatRefreshBtn">Frissítés</button>
        <button class="pdf-filter-btn" id="pdfBtn">PDF-jelentés letöltése</button>
      </div>
      <div id="vatHeroContainer">${renderVatSummaryHtml(vatSummary)}</div>\n      <div id="paymentContainer">${renderPaymentSummaryHtml(paymentSummary)}</div>

      <div class="section-title">Napi szinkron állapota</div>
      ${statusHtml}

      <div class="section-title">Bevételi küszöbök (${new Date().getFullYear()})</div>
      ${thresholdHtml}
    `;

    document.getElementById("vatRefreshBtn").addEventListener("click", async () => {
      const from = document.getElementById("vatFrom").value;
      const to = document.getElementById("vatTo").value;
      const container = document.getElementById("vatHeroContainer");
      const paymentContainer = document.getElementById("paymentContainer");
      container.innerHTML = `<div class="loading">Számolás...</div>`;
      paymentContainer.innerHTML = `<div class="loading">Számolás...</div>`;
      try {
        const summary = await computeVatSummary(company.id, from, to);
        container.innerHTML = renderVatSummaryHtml(summary);
        const paymentSummary = await computePaymentSummary(company.id, from, to);
        paymentContainer.innerHTML = renderPaymentSummaryHtml(paymentSummary);
      } catch (err) {
        container.innerHTML = `<div class="empty-state">Hiba: ${err.message}</div>`;
      }
    });

    document.getElementById("pdfBtn").addEventListener("click", async () => {
      const btn = document.getElementById("pdfBtn");
      const from = document.getElementById("vatFrom").value;
      const to = document.getElementById("vatTo").value;
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Készül...";
      try {
        const [freshVatSummary, freshPaymentSummary, thresholdChecks] = await Promise.all([
          computeVatSummary(company.id, from, to),
          computePaymentSummary(company.id, from, to),
          computeThresholdChecks(company),
        ]);
        await buildReportPdf({ company, from, to, vatSummary: freshVatSummary, paymentSummary: freshPaymentSummary, thresholdChecks });
      } catch (err) {
        alert("Hiba történt a PDF elkészítése közben: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  } catch (err) {
    content.innerHTML = `<div class="empty-state">Hiba történt az adatok betöltésekor: ${err.message}</div>`;
  }
}

main();
</script>
