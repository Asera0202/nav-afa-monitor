<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irányítópult — Cégfókusz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f5fa; --surface: #ffffff;
    --surface-sidebar: #0f1a33; --surface-sidebar-hover: #182746;
    --ink: #12172b; --ink-soft: #5a6178; --ink-faint: #9297ab;
    --line: #e6e8f0; --accent: #1f3a7a; --accent-soft: #e9edf7; --accent-ink: #ffffff;
    --on-sidebar: #d8d9ec; --on-sidebar-soft: #7c7f9e;
    --ok: #1a7f4e; --ok-soft: #e8f5ee;
    --warn: #a4650a; --warn-soft: #faf1e3;
    --critical: #b3261e; --critical-soft: #fbeceb;
    --shadow: 0 1px 2px rgba(20,21,42,0.04), 0 8px 24px rgba(20,21,42,0.05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar { width: 232px; flex-shrink: 0; background: var(--surface-sidebar); color: var(--on-sidebar); display: flex; flex-direction: column; padding: 1.5rem 1rem; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem; margin-bottom: 2.2rem; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(155deg, #3f5fac, var(--accent)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-mark img { width: 20px; height: 20px; }
  .brand-name { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.01em; color: #fff; }

  .nav-group-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--on-sidebar-soft); padding: 0 0.6rem; margin: 0 0 0.5rem; }
  nav.nav { display: flex; flex-direction: column; gap: 0.15rem; margin-bottom: 1.6rem; }
  .nav-link { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.6rem; border-radius: 8px; color: var(--on-sidebar-soft); text-decoration: none; font-size: 0.87rem; font-weight: 500; }
  .nav-link svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.85; }
  .nav-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }
  .nav-link.active { background: var(--surface-sidebar-hover); color: #fff; }
  .nav-link.active svg { opacity: 1; color: #7093e8; }

  .sidebar-foot { margin-top: auto; }
  .id-card { position: relative; border-radius: 12px; padding: 0.95rem 1rem; background: linear-gradient(150deg, #1c2c52, #0a1226 88%); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
  .id-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120px 90px at 100% 0%, rgba(112,147,232,0.22), transparent 70%); pointer-events: none; }
  .id-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.1rem; }
  .id-chip { width: 22px; height: 16px; border-radius: 3px; background: linear-gradient(160deg, #c9d3ec, #8b96b8); }
  .id-status { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8fe3b0; display: flex; align-items: center; gap: 0.3rem; }
  .id-status .dot { width: 5px; height: 5px; border-radius: 999px; background: #3fcb84; flex-shrink: 0; }
  .id-card-number { font-family: var(--sans); font-variant-numeric: tabular-nums; letter-spacing: 0.09em; font-size: 0.86rem; color: #eef0fa; margin-bottom: 0.7rem; }
  .id-card-name { font-size: 0.82rem; font-weight: 600; color: #fff; }
  .id-card-sub { font-size: 0.68rem; color: #8992b8; margin-top: 0.1rem; }

  .trust-note { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.9rem; padding: 0 0.3rem; font-size: 0.68rem; color: var(--on-sidebar-soft); }
  .trust-note svg { width: 12px; height: 12px; flex-shrink: 0; }

  .logout-link { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.8rem; color: var(--on-sidebar-soft); text-decoration: none; background: none; border: none; cursor: pointer; font-family: var(--sans); width: 100%; text-align: left; }
  .logout-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }
  .logout-link svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* ---------- Main ---------- */
  main { flex: 1; min-width: 0; }
  .topbar { padding: 1.3rem 2.2rem; border-bottom: 1px solid var(--line); background: var(--surface); }
  .topbar h1 { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; margin: 0 0 0.2rem; letter-spacing: 0.01em; }
  .topbar .sub { font-size: 0.8rem; color: var(--ink-soft); }

  .wrap { max-width: 760px; padding: 1.8rem 2.2rem 4rem; }
  .company-header { margin-bottom: 1.5rem; }
  .company-header h1 { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; margin: 0 0 0.2rem; }
  .company-header .sub { font-size: 0.85rem; color: var(--ink-soft); }

  .section-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); margin: 2rem 0 0.8rem; }
  .section-title-row { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin: 2rem 0 0.8rem; }
  .section-title-row .section-title { margin: 0; }
  .sync-refresh-btn {
    font-family: var(--sans); font-size: 0.76rem; font-weight: 600; padding: 0.35rem 0.75rem;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap;
  }
  .sync-refresh-btn:hover { background: var(--accent-soft); }
  .sync-refresh-btn:disabled { opacity: 0.55; cursor: default; }
  .sync-refresh-btn svg { width: 12px; height: 12px; }
  .sync-refresh-note { font-size: 0.76rem; margin: -0.4rem 0 0.8rem; }
  .sync-refresh-note.error { color: var(--critical); }
  .sync-refresh-note.ok { color: var(--ok); }
  .section-title:first-of-type { margin-top: 0; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1.3rem 1.4rem; margin-bottom: 1rem; }

  .source-row { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.8rem; padding: 0.55rem 0; border-top: 1px solid var(--line); align-items: baseline; }
  .source-row:first-of-type { border-top: none; }
  .source-name { font-size: 0.85rem; color: var(--ink-soft); grid-column: 1; }
  .source-status { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; grid-column: 2; white-space: nowrap; }
  .source-detail { grid-column: 1 / -1; font-size: 0.75rem; color: var(--ink-faint); }
  .status-ok { background: var(--ok-soft); color: var(--ok); }
  .status-error { background: var(--critical-soft); color: var(--critical); }
  .status-stale { background: var(--warn-soft); color: var(--warn); }
  .status-missing { background: var(--accent-soft); color: var(--ink-faint); }

  .threshold-row { margin-bottom: 1rem; }
  .threshold-row:last-child { margin-bottom: 0; }
  .threshold-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; }
  .threshold-numbers { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 0.4rem; font-variant-numeric: tabular-nums; }
  .bar-track { height: 6px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-ok { background: var(--ok); }
  .bar-warn { background: var(--warn); }
  .bar-over { background: var(--critical); }
  .no-threshold { font-size: 0.82rem; color: var(--ink-soft); }

  .enyugta-card { display: flex; gap: 0.7rem; align-items: flex-start; }
  .enyugta-icon { font-size: 1.3rem; line-height: 1; flex-shrink: 0; }
  .enyugta-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 0.3rem; }
  .enyugta-text { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.6; }
  .enyugta-text a { color: var(--accent); }
  .enyugta-ok .enyugta-title { color: var(--ok); }
  .enyugta-warn .enyugta-title { color: var(--warn); }

  .vat-hero { border-radius: 14px; padding: 1.6rem 1.7rem; margin-bottom: 1.6rem; color: #fff; border: 1px solid rgba(255,255,255,0.08); }
  .vat-payable { background: linear-gradient(150deg, #22336b, var(--surface-sidebar) 88%); }
  .vat-refund { background: linear-gradient(150deg, #145c3f, #0a1226 88%); }
  .vat-hero-label { font-size: 0.82rem; opacity: 0.85; margin-bottom: 0.5rem; }
  .vat-hero-amount { font-family: var(--serif); font-size: 2.3rem; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; margin-bottom: 1rem; }
  .vat-hero-breakdown { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.8rem; opacity: 0.92; padding-top: 0.9rem; border-top: 1px solid rgba(255,255,255,0.14); }
  .vat-hero-breakdown .dot { display: inline-block; width: 7px; height: 7px; border-radius: 999px; margin-right: 0.4rem; background: rgba(255,255,255,0.7); }

  .vat-filter { display: flex; gap: 0.7rem; align-items: end; margin-bottom: 0.9rem; flex-wrap: wrap; }
  .vat-filter-group { display: flex; flex-direction: column; gap: 0.25rem; }
  .vat-filter-group label { font-size: 0.72rem; color: var(--ink-soft); font-weight: 600; }
  .vat-filter-group input {
    font-family: var(--sans); font-size: 0.82rem; padding: 0.4rem 0.55rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  .vat-filter-btn {
    font-family: var(--sans); font-size: 0.82rem; font-weight: 600; padding: 0.45rem 1rem;
    border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .pdf-filter-btn {
    font-family: var(--sans); font-size: 0.82rem; font-weight: 600; padding: 0.44rem 1rem;
    border-radius: 8px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer;
  }
  .pdf-filter-btn:disabled { opacity: 0.55; cursor: default; }

  .payment-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1.3rem 1.4rem; margin-bottom: 1rem; }
  .payment-summary-text { font-size: 0.88rem; line-height: 1.6; margin-bottom: 0.9rem; }
  .payment-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin-bottom: 0.7rem; gap: 2px; }
  .payment-bar-segment { height: 100%; }
  .payment-legend { display: flex; flex-direction: column; gap: 0.35rem; }
  .payment-legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
  .payment-legend-item .legend-label { display: flex; align-items: center; gap: 0.5rem; }
  .payment-legend-item .legend-dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }

  .loading, .empty-state { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); font-size: 0.9rem; }

  @media (max-width: 820px) {
    .sidebar { display: none; }
    .wrap, .topbar { padding-left: 1.2rem; padding-right: 1.2rem; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SOURCE_LABELS = {
  opg: "Pénztárgép",
  invoice_inbound: "Bejövő számlák",
  invoice_outbound: "Kimenő számlák",
};

const THRESHOLDS = {
  kata: { label: "KATA (kisadózó)", limit: 18_000_000 },
  atalanyado: { label: "Átalányadó", limit: 38_736_000 },
  alanyi_mentes: { label: "Alanyi ÁFA-mentesség", limit: 20_000_000 },
};

function formatFt(n) {
  return Math.round(n).toLocaleString("hu-HU") + " Ft";
}

function formatDateTime(iso) {
  return new Date(iso).toLocaleString("hu-HU", { dateStyle: "short", timeStyle: "short" });
}

function hoursSince(iso) {
  return (Date.now() - new Date(iso).getTime()) / (1000 * 60 * 60);
}

function yearStartIso() {
  return new Date(Date.UTC(new Date().getUTCFullYear(), 0, 1)).toISOString();
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.href = "login.html";
});

async function renderStatusSection(companyId) {
  const since = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString();
  const { data: runs, error } = await sb
    .from("sync_runs")
    .select("source, run_at, items_found, error_message")
    .eq("company_id", companyId)
    .gte("run_at", since)
    .order("run_at", { ascending: false });
  if (error) throw error;

  const latestBySource = {};
  for (const run of runs ?? []) {
    if (!latestBySource[run.source]) latestBySource[run.source] = run;
  }

  const rows = Object.keys(SOURCE_LABELS)
    .map((source) => {
      const run = latestBySource[source];
      let statusClass = "status-missing";
      let statusText = "Nincs adat még";
      let detail = "";

      if (run) {
        const age = hoursSince(run.run_at);
        if (run.error_message) {
          statusClass = "status-error";
          statusText = "Hiba";
          detail = run.error_message;
        } else if (age > 30) {
          statusClass = "status-stale";
          statusText = "Elmaradt futás";
          detail = `Utolsó futás: ${formatDateTime(run.run_at)}`;
        } else {
          statusClass = "status-ok";
          statusText = "Rendben";
          detail = `${run.items_found ?? 0} tétel · utoljára: ${formatDateTime(run.run_at)}`;
        }
      }

      return `
      <div class="source-row">
        <div class="source-name">${SOURCE_LABELS[source]}</div>
        <div class="source-status ${statusClass}">${statusText}</div>
        <div class="source-detail">${detail}</div>
      </div>`;
    })
    .join("");

  return `<div class="card">${rows}</div>`;
}

// 2026.09.01-től minden nyugtaadatot elektronikusan kell jelenteni a NAV
// felé, akik nem online/e-pénztárgéppel adnak nyugtát. Akinek már van
// regisztrált online pénztárgépe (cash_registers), arra ez a konkrét
// határidő nem vonatkozik közvetlenül (2028.07.01-ig térhet át e-pénztárgépre)
// — ezért a cash_registers tartalma alapján adunk személyre szabott jelzést,
// nem egy általános, mindenkinek egyforma figyelmeztetést.
async function renderENyugtaSection(companyId) {
  const { data: registers, error } = await sb
    .from("cash_registers")
    .select("ap_number")
    .eq("company_id", companyId);
  if (error) throw error;

  const hasRegisters = (registers ?? []).length > 0;

  if (hasRegisters) {
    const apList = registers.map((r) => r.ap_number).join(", ");
    return `
    <div class="card enyugta-card enyugta-ok">
      <div class="enyugta-icon">✅</div>
      <div>
        <div class="enyugta-title">Rendben — 2028.07.01-ig van időd</div>
        <div class="enyugta-text">
          Van regisztrált online pénztárgéped a rendszerben (${apList}). A 2026.09.01-től hatályos új
          nyugtaadat-jelentési kötelezettség elsősorban azokat érinti, akik nem online/e-pénztárgéppel adnak
          nyugtát — rád ez közvetlenül nem vonatkozik. Online pénztárgéped használata mellett 2028.07.01-ig
          kell majd áttérned e-pénztárgépre.
        </div>
      </div>
    </div>`;
  }

  return `
  <div class="card enyugta-card enyugta-warn">
    <div class="enyugta-icon">⚠️</div>
    <div>
      <div class="enyugta-title">Nincs regisztrált online pénztárgéped</div>
      <div class="enyugta-text">
        Ha kézzel írt vagy nem gépi (pl. számítógépes, de nem pénztárgépes) nyugtát adsz, 2026.09.01-től
        minden nyugtaadatot 3 naptári napon belül elektronikusan kell jelentened a NAV felé. Ha ez rád
        vonatkozik, érdemes lehet a NAV ingyenes e-Nyugta/e-Pénztárgép alkalmazására áttérni —
        <a href="https://nav.gov.hu/e-nyugta" target="_blank" rel="noopener">bővebben a NAV oldalán</a>.
      </div>
    </div>
  </div>`;
}

async function computeVatSummary(companyId, fromIso, toIso) {
  const [{ data: outboundRows, error: e1 }, { data: inboundRows, error: e2 }, { data: opgRows, error: e3 }] = await Promise.all([
    sb.from("invoice_vat_lines").select("vat_amount").eq("company_id", companyId).eq("direction", "OUTBOUND").gte("issue_date", fromIso).lte("issue_date", toIso),
    sb.from("invoice_vat_lines").select("vat_amount").eq("company_id", companyId).eq("direction", "INBOUND").gte("issue_date", fromIso).lte("issue_date", toIso),
    sb.from("opg_receipt_items").select("vat_amount").eq("company_id", companyId).gte("transaction_at", fromIso).lte("transaction_at", toIso + "T23:59:59"),
  ]);
  if (e1 || e2 || e3) throw (e1 || e2 || e3);

  const sum = (rows) => (rows ?? []).reduce((s, r) => s + Number(r.vat_amount ?? 0), 0);
  const outboundVat = sum(outboundRows);
  const opgVat = sum(opgRows);
  const inboundVat = sum(inboundRows);
  const net = outboundVat + opgVat - inboundVat;
  return { outboundVat, opgVat, inboundVat, net };
}

// Anomália-jelzés: ÁFA-kulcsonként összehasonlítja a beszerzést (bejövő
// számla nettó) és az értékesítést (kimenő számla + pénztárgép nettó) a
// kiválasztott időszakra. Ha az egyik oldal aránytalanul (ANOMALY_MULTIPLIER-
// szeresnél jobban) meghaladja a másikat, és az eltérés összege is számottevő
// (ANOMALY_MIN_DIFF fölött van, hogy ne jelezzen apró, zajszintű eltéréseket),
// az valószínűleg hiányzó számlára, tévesen rögzített ÁFA-kulcsra, vagy
// szokatlan készletmozgásra utal — ezt jelezzük.
const ANOMALY_MULTIPLIER = 2.5;
const ANOMALY_MIN_DIFF = 50000;

function formatVatRate(rate) {
  const pct = Math.round((rate ?? 0) * 100);
  return pct === 0 ? "0% / AJT" : `${pct}%`;
}

async function computeAnomalies(companyId, fromIso, toIso) {
  const [{ data: inboundRows, error: e1 }, { data: outboundRows, error: e2 }, { data: opgRows, error: e3 }] = await Promise.all([
    sb.from("invoice_vat_lines").select("net_amount, vat_percentage").eq("company_id", companyId).eq("direction", "INBOUND").gte("issue_date", fromIso).lte("issue_date", toIso),
    sb.from("invoice_vat_lines").select("net_amount, vat_percentage").eq("company_id", companyId).eq("direction", "OUTBOUND").gte("issue_date", fromIso).lte("issue_date", toIso),
    sb.from("opg_receipt_items").select("net_amount, vat_percentage").eq("company_id", companyId).gte("transaction_at", fromIso).lte("transaction_at", toIso + "T23:59:59"),
  ]);
  if (e1 || e2 || e3) throw (e1 || e2 || e3);

  const purchasesByRate = new Map();
  const salesByRate = new Map();
  const addTo = (map, rate, amount) => map.set(rate, (map.get(rate) ?? 0) + Number(amount ?? 0));

  for (const r of inboundRows ?? []) addTo(purchasesByRate, r.vat_percentage ?? 0, r.net_amount);
  for (const r of outboundRows ?? []) addTo(salesByRate, r.vat_percentage ?? 0, r.net_amount);
  for (const r of opgRows ?? []) addTo(salesByRate, r.vat_percentage ?? 0, r.net_amount);

  const allRates = new Set([...purchasesByRate.keys(), ...salesByRate.keys()]);
  const anomalies = [];

  for (const rate of allRates) {
    const purchases = purchasesByRate.get(rate) ?? 0;
    const sales = salesByRate.get(rate) ?? 0;
    const diff = Math.abs(sales - purchases);
    if (diff < ANOMALY_MIN_DIFF) continue;

    const higher = Math.max(sales, purchases);
    const lower = Math.min(sales, purchases);
    const ratio = lower === 0 ? Infinity : higher / lower;
    if (ratio < ANOMALY_MULTIPLIER) continue;

    anomalies.push({
      rate,
      purchases,
      sales,
      direction: sales > purchases ? "sales" : "purchases",
    });
  }

  anomalies.sort((a, b) => Math.abs(b.sales - b.purchases) - Math.abs(a.sales - a.purchases));
  return anomalies;
}

function renderAnomaliesHtml(anomalies) {
  if (anomalies.length === 0) {
    return `<div class="card"><div class="no-threshold">Nincs kiugró eltérés a beszerzés és az értékesítés ÁFA-kulcsonkénti aránya között ebben az időszakban.</div></div>`;
  }
  const rows = anomalies
    .map((a) => {
      const label =
        a.direction === "sales"
          ? `Az értékesítés (${formatFt(a.sales)}) jelentősen meghaladja a beszerzést (${formatFt(a.purchases)}) — lehet, hogy hiányzik egy bejövő számla, vagy tévesen van rögzítve az ÁFA-kulcs.`
          : `A beszerzés (${formatFt(a.purchases)}) jelentősen meghaladja az értékesítést (${formatFt(a.sales)}) — lehet, hogy készletet halmozol, vagy hiányzik egy értékesítési tétel.`;
      return `
      <div class="card enyugta-card enyugta-warn" style="margin-bottom:0.7rem;">
        <div class="enyugta-icon">⚠️</div>
        <div>
          <div class="enyugta-title">${formatVatRate(a.rate)} ÁFA-kulcs</div>
          <div class="enyugta-text">${label}</div>
        </div>
      </div>`;
    })
    .join("");
  return rows;
}

function defaultVatDates() {
  const now = new Date();
  const from = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)).toISOString().slice(0, 10);
  const to = now.toISOString().slice(0, 10);
  return { from, to };
}

const PAYMENT_COLORS = { "Bankkártya": "#4338ca", "Készpénz": "#16a34a", "Egyéb": "#d97706" };

async function computePaymentSummary(companyId, fromIso, toIso) {
  const { data, error } = await sb
    .from("opg_receipt_payments")
    .select("payment_type, amount")
    .eq("company_id", companyId)
    .gte("transaction_at", fromIso)
    .lte("transaction_at", toIso + "T23:59:59");

  const totals = { "Bankkártya": 0, "Készpénz": 0, "Egyéb": 0 };
  for (const row of data ?? []) {
    const key = row.payment_type === "Bankkártya" || row.payment_type === "Készpénz" ? row.payment_type : "Egyéb";
    totals[key] += Number(row.amount ?? 0);
  }
  return totals;
}

function renderPaymentSummaryHtml(totals) {
  const grandTotal = totals["Bankkártya"] + totals["Készpénz"] + totals["Egyéb"];

  if (grandTotal === 0) {

  }

  const cashPct = pct(totals["Készpénz"]);

  const barSegments = Object.entries(totals)

async function computeThresholdChecks(company) {
  const from = yearStartIso();

  const { data: invoiceRows, error: invoiceError } = await sb
    .from("invoice_vat_lines")
    .select("net_amount")
    .eq("company_id", company.id)
    .eq("direction", "OUTBOUND")
    .gte("issue_date", from);
  if (invoiceError) throw invoiceError;

  const { data: opgRows, error: opgError } = await sb
    .from("opg_receipt_items")
    .select("net_amount")
    .eq("company_id", company.id)
    .gte("transaction_at", from);
  if (opgError) throw opgError;

  const invoiceTotal = (invoiceRows ?? []).reduce((s, r) => s + Number(r.net_amount ?? 0), 0);
  const opgTotal = (opgRows ?? []).reduce((s, r) => s + Number(r.net_amount ?? 0), 0);
  const revenue = invoiceTotal + opgTotal;

  const checks = [];
  if (company.tax_regime === "kata") checks.push({ ...THRESHOLDS.kata, revenue });
  if (company.tax_regime === "atalanyado") checks.push({ ...THRESHOLDS.atalanyado, revenue });
  if (company.alanyi_mentes) checks.push({ ...THRESHOLDS.alanyi_mentes, revenue });

  return checks;
}

function renderThresholdHtml(checks) {
  if (checks.length === 0) {
    return `<div class="card"><div class="no-threshold">Nincs beállított figyelendő bevételi küszöb (normál adózás, nem alanyi mentes).</div></div>`;
  }

  const rows = checks
    .map((c) => {
      const percent = (c.revenue / c.limit) * 100;
      const pct = Math.min(percent, 100);
      let barClass = "bar-ok";
      if (percent >= 100) barClass = "bar-over";
      else if (percent >= 80) barClass = "bar-warn";

      return `
      <div class="threshold-row">
        <div class="threshold-label">${c.label}</div>
        <div class="threshold-numbers">${formatFt(c.revenue)} / ${formatFt(c.limit)} (${percent.toFixed(1)}%)</div>
        <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${pct}%"></div></div>
      </div>`;
    })
    .join("");

  return `<div class="card">${rows}</div>`;
}

async function renderThresholdSection(company) {
  const checks = await computeThresholdChecks(company);
  return renderThresholdHtml(checks);
}

  // Minden szakasz (és minden küszöb-sor) egy-egy `data-pdf-block`

        <div style="border-top:1px solid #eaeaf3;margin-bottom:20px;"></div>

        </div>
      </div>
    </div>`;
}

async function buildReportPdf(data) {
  await document.fonts.ready;

  const container = document.createElement("div");
  container.style.cssText = "position:fixed; left:-10000px; top:0; width:686px; background:#ffffff; padding:32px;";
  container.innerHTML = renderReportHtml(data);
  document.body.appendChild(container);

  try {
    // Közvetlenül a html2canvas-t hívjuk, és a kapott raszterképet tesszük
    // be a PDF-be — a jsPDF saját .html() metódusa a szöveget a jsPDF
    // korlátozott, WinAnsi-kódolású betűtípusával próbálná "vektorosan"
    // újrarajzolni, ami visszahozná a magyar ő/ű hiányát. Így viszont
    // pixelpontosan azt kapjuk, amit a böngésző valóban megrajzolt.
    const blockOffsetsPx = Array.from(container.querySelectorAll("[data-pdf-block]")).map((el) => el.offsetTop);

    const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
    const canvasScale = canvas.width / container.offsetWidth;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const margin = 40;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const imgWidth = pageWidth - margin * 2;
    const pxToPt = imgWidth / canvas.width;
    const pageContentHeightPx = (pageHeight - margin * 2) / pxToPt;

    // A blokkhatárok (canvas-pixelben) jelölik ki, hol szabad lapot váltani —
    // soha nem egy sor vagy szakasz közepén, mindig a blokkok között.
    const breakPointsPx = blockOffsetsPx.map((top) => top * canvasScale);
    breakPointsPx.push(canvas.height);

    let sy = 0;
    let first = true;
    while (sy < canvas.height - 0.5) {
      let sliceEnd = canvas.height;
      for (const bp of breakPointsPx) {
        if (bp <= sy + 0.5) continue;
        if (bp - sy <= pageContentHeightPx) {
          sliceEnd = bp;
        } else {
          break;
        }
      }
      // Ha egyetlen blokk sem fér ki egy oldalon (nagyon magas blokk),
      // biztonságból egyszerűen levágjuk az oldal magasságánál.
      if (sliceEnd <= sy) sliceEnd = Math.min(sy + pageContentHeightPx, canvas.height);

      const sliceHeightPx = sliceEnd - sy;
      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeightPx;
      pageCanvas.getContext("2d").drawImage(canvas, 0, sy, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

      if (!first) doc.addPage();
      first = false;
      doc.addImage(pageCanvas.toDataURL("image/png"), "PNG", margin, margin, imgWidth, sliceHeightPx * pxToPt);

      sy = sliceEnd;
    }

    const safeFrom = data.from.replaceAll("-", "");
    const safeTo = data.to.replaceAll("-", "");
    doc.save(`cegfokusz-jelentes_${data.company.tax_number}_${safeFrom}-${safeTo}.pdf`);
  } finally {
    container.remove();
  }
}

    `;

    document.getElementById("syncNowBtn").addEventListener("click", async () => {
      const btn = document.getElementById("syncNowBtn");
      const note = document.getElementById("syncNowNote");
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = "Indítás...";
      note.style.display = "none";
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(`${SUPABASE_URL}/functions/v1/trigger-sync`, {
          method: "POST",
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        const body = await res.json();
        note.textContent = body.message || body.error;
        note.className = "sync-refresh-note " + (res.ok ? "ok" : "error");
        note.style.display = "block";
      } catch (err) {
        note.textContent = "Hiba történt a frissítés indításakor: " + err.message;
        note.className = "sync-refresh-note error";
        note.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    });

    document.getElementById("vatRefreshBtn").addEventListener("click", async () => {
      const from = document.getElementById("vatFrom").value;
      const to = document.getElementById("vatTo").value;
      const container = document.getElementById("vatHeroContainer");
      const paymentContainer = document.getElementById("paymentContainer");
      const anomaliesContainer = document.getElementById("anomaliesContainer");
      container.innerHTML = `<div class="loading">Számolás...</div>`;
      paymentContainer.innerHTML = `<div class="loading">Számolás...</div>`;
      anomaliesContainer.innerHTML = `<div class="loading">Számolás...</div>`;
      try {
        const summary = await computeVatSummary(company.id, from, to);
        container.innerHTML = renderVatSummaryHtml(summary);
        const paymentSummary = await computePaymentSummary(company.id, from, to);
        paymentContainer.innerHTML = renderPaymentSummaryHtml(paymentSummary);
        const anomalies = await computeAnomalies(company.id, from, to);
        anomaliesContainer.innerHTML = renderAnomaliesHtml(anomalies);
      } catch (err) {
        container.innerHTML = `<div class="empty-state">Hiba: ${err.message}</div>`;
      }
    });

    document.getElementById("pdfBtn").addEventListener("click", async () => {
      const btn = document.getElementById("pdfBtn");
      const from = document.getElementById("vatFrom").value;
      const to = document.getElementById("vatTo").value;
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Készül...";
      try {
        const [freshVatSummary, freshPaymentSummary, thresholdChecks] = await Promise.all([
          computeVatSummary(company.id, from, to),
          computePaymentSummary(company.id, from, to),
          computeThresholdChecks(company),
        ]);
        await buildReportPdf({ company, from, to, vatSummary: freshVatSummary, paymentSummary: freshPaymentSummary, thresholdChecks });
      } catch (err) {
        alert("Hiba történt a PDF elkészítése közben: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  } catch (err) {
    content.innerHTML = `<div class="empty-state">Hiba történt az adatok betöltésekor: ${err.message}</div>`;
  }
}

main();
</script>
</body>
</html>
