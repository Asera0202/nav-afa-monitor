<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Új jelszó — Cégfókusz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f5fa; --surface: #ffffff; --ink: #12172b; --ink-soft: #5a6178;
    --line: #e6e8f0; --accent: #1f3a7a;
    --danger: #b3261e; --danger-soft: #fbeceb; --ok: #1a7f4e; --ok-soft: #e8f5ee;
    --shadow: 0 1px 2px rgba(20,21,42,0.04), 0 8px 24px rgba(20,21,42,0.05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { max-width: 400px; width: 100%; padding: 1.25rem; }
  .masthead { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 1.5rem; justify-content: center; }
  .masthead .logo-mark { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(155deg, #3f5fac, var(--accent)); display: flex; align-items: center; justify-content: center; }
  .masthead .logo-mark img { width: 26px; height: 26px; }
  .masthead .title { font-family: var(--serif); font-size: 1.2rem; letter-spacing: 0.01em; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 1.8rem 1.6rem; }
  label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; margin-top: 0.9rem; }
  label:first-of-type { margin-top: 0; }
  input[type="password"] {
    width: 100%; font-family: var(--sans); font-size: 0.9rem; padding: 0.6rem 0.75rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--ground); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }

  .submit-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0.8rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 1.2rem; }
  .submit-btn:hover { background: #17305f; }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .status { display: none; border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.84rem; margin-bottom: 1.1rem; line-height: 1.5; }
  .status.error { display: block; background: var(--danger-soft); color: #7a1c16; }
  .status.success { display: block; background: var(--ok-soft); color: #135a37; }
</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <div class="logo-mark"><img src="favicon.svg" alt=""></div>
      <div class="title">Cégfókusz</div>
    </div>

    <div class="card">
      <div id="statusBox" class="status"></div>
      <form id="resetForm">
        <label>Új jelszó</label>
        <input type="password" id="password" minlength="8" required>
        <label>Új jelszó megerősítése</label>
        <input type="password" id="passwordConfirm" minlength="8" required>
        <button type="submit" class="submit-btn" id="submitBtn">Jelszó mentése</button>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showStatus(message, type) {
  const box = document.getElementById("statusBox");
  box.textContent = message;
  box.className = "status " + type;
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById("submitBtn");
  const password = document.getElementById("password").value;
  const passwordConfirm = document.getElementById("passwordConfirm").value;

  if (password !== passwordConfirm) {
    showStatus("A két jelszó nem egyezik.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Mentés...";

  const { error } = await sb.auth.updateUser({ password });

  if (error) {
    showStatus("Hiba: " + error.message + " (Előfordulhat, hogy a link lejárt — kérj újat a bejelentkező oldalon.)", "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Jelszó mentése";
  } else {
    document.getElementById("resetForm").style.display = "none";
    showStatus("A jelszavad sikeresen frissült! Most már bejelentkezhetsz az új jelszóval.", "success");
  }
});
</script>
</body>
</html>
