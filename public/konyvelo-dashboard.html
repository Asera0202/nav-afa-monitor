<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Könyvelői felület — Cégfókusz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f5fa; --surface: #ffffff;
    --surface-sidebar: #0f1a33; --surface-sidebar-hover: #182746;
    --ink: #12172b; --ink-soft: #5a6178; --ink-faint: #9297ab;
    --line: #e6e8f0; --accent: #1f3a7a; --accent-soft: #e9edf7; --accent-ink: #ffffff;
    --on-sidebar: #d8d9ec; --on-sidebar-soft: #7c7f9e;
    --danger: #b3261e; --danger-soft: #fbeceb; --ok: #1a7f4e; --ok-soft: #e8f5ee;
    --warn: #a4650a; --warn-soft: #faf1e3;
    --shadow: 0 1px 2px rgba(20,21,42,0.04), 0 8px 24px rgba(20,21,42,0.05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; display: flex; min-height: 100vh; }

  .sidebar { width: 220px; flex-shrink: 0; background: var(--surface-sidebar); color: var(--on-sidebar); display: flex; flex-direction: column; padding: 1.5rem 1rem; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem; margin-bottom: 2.2rem; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(155deg, #3f5fac, var(--accent)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-mark img { width: 20px; height: 20px; }
  .brand-name { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.01em; color: #fff; }
  .brand-sub { font-size: 0.68rem; color: var(--on-sidebar-soft); margin-top: 0.1rem; }

  .sidebar-foot { margin-top: auto; }
  .logout-link { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.8rem; color: var(--on-sidebar-soft); text-decoration: none; background: none; border: none; cursor: pointer; font-family: var(--sans); width: 100%; text-align: left; }
  .logout-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }

  main { flex: 1; min-width: 0; }
  .wrap { max-width: 860px; padding: 1.8rem 2.2rem 4rem; }
  h1 { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; margin: 0 0 0.3rem; }
  .page-desc { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 1.4rem; line-height: 1.5; }

  .loading { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); font-size: 0.9rem; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1.3rem 1.4rem; margin-bottom: 1.2rem; }
  .card h2 { font-size: 0.9rem; margin: 0 0 0.7rem; }

  .referral-box { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .referral-code { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); background: var(--accent-soft); padding: 0.5rem 1rem; border-radius: 10px; }
  .copy-btn { font-size: 0.8rem; font-weight: 600; padding: 0.5rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; }
  .copy-btn:hover { background: var(--accent-soft); }

  .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 140px; background: var(--ground); border-radius: 10px; padding: 0.9rem 1rem; }
  .stat-num { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; }
  .stat-label { font-size: 0.74rem; color: var(--ink-soft); margin-top: 0.15rem; }

  .company-row { border-top: 1px solid var(--line); padding: 0.9rem 0; }
  .company-row:first-child { border-top: none; }
  .company-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem; }
  .company-name { font-size: 0.92rem; font-weight: 700; }
  .company-tax { font-size: 0.74rem; color: var(--ink-faint); margin-top: 0.1rem; }
  .status-badge { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; white-space: nowrap; }
  .status-trial { background: var(--accent-soft); color: var(--accent); }
  .status-active { background: var(--ok-soft); color: var(--ok); }
  .status-past_due { background: var(--danger-soft); color: var(--danger); }

  .upload-list { margin-top: 0.6rem; font-size: 0.78rem; color: var(--ink-soft); }
  .upload-item { padding: 0.25rem 0; }
  .empty-state { text-align: center; padding: 2rem 1rem; color: var(--ink-soft); font-size: 0.85rem; }

  @media (max-width: 820px) {
    .sidebar { display: none; }
    .wrap { padding-left: 1.2rem; padding-right: 1.2rem; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="favicon.svg" alt=""></div>
      <div>
        <div class="brand-name">Cégfókusz</div>
        <div class="brand-sub">Könyvelői felület</div>
      </div>
    </div>
    <div class="sidebar-foot">
      <button class="logout-link" id="logoutBtn">Kijelentkezés</button>
    </div>
  </aside>

  <main>
    <div class="wrap">
      <h1>Könyvelői felület</h1>
      <div class="page-desc">Az általad ajánlott vállalkozások, az előfizetési állapotuk és a legutóbbi feltöltéseik — amint egy ügyfeled feltölt valamit, itt azonnal megjelenik.</div>
      <div id="loadingBox" class="loading">Betöltés...</div>

      <div id="content" style="display:none;"></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const TIER_LABELS = { sav1: "Alap sáv", sav2: "Közepes sáv", sav3: "Nagy sáv" };
const STATUS_LABELS = { trial: "Próbaidőszak", active: "Aktív előfizetés", past_due: "Elmaradt fizetés", canceled: "Lemondva" };
const UPLOAD_KIND_LABELS = { kobak_penztargep: "KOBAK pénztárgépes export", konyveloi_afa: "Könyvelői kimutatás", jarulek_osszesito: "Járulék utalási összesítő", egyeb: "Egyéb" };

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.href = "konyvelo-login.html";
});

async function main() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = "konyvelo-login.html";
    return;
  }

  const { data: accountant, error: accError } = await sb
    .from("accountants")
    .select("*")
    .eq("user_id", session.user.id)
    .maybeSingle();

  if (accError || !accountant) {
    document.getElementById("loadingBox").textContent = "Nem található könyvelői fiók ehhez a bejelentkezéshez.";
    return;
  }

  const { data: rateSetting } = await sb
    .from("platform_settings")
    .select("value")
    .eq("key", "accountant_commission_rate")
    .maybeSingle();
  const currentRatePct = Math.round((rateSetting ? parseFloat(rateSetting.value) : 0.25) * 100);

  const { data: companies } = await sb
    .from("companies")
    .select("id, name, tax_number, created_at")
    .eq("referred_by_accountant_id", accountant.id)
    .order("created_at", { ascending: false });

  const companyIds = (companies ?? []).map((c) => c.id);

  let subsByCompany = {};
  let uploadsByCompany = {};
  let payments = [];

  if (companyIds.length > 0) {
    const [{ data: subs }, { data: uploads }, { data: pays }] = await Promise.all([
      sb.from("subscriptions").select("company_id, status, tier, current_period_end").in("company_id", companyIds),
      sb.from("manual_data_uploads").select("company_id, kind, file_name, status, created_at").in("company_id", companyIds).order("created_at", { ascending: false }),
      sb.from("subscription_payments").select("company_id, price, period_start, commission_rate").in("company_id", companyIds),
    ]);
    for (const s of subs ?? []) subsByCompany[s.company_id] = s;
    for (const u of uploads ?? []) {
      uploadsByCompany[u.company_id] = uploadsByCompany[u.company_id] ?? [];
      if (uploadsByCompany[u.company_id].length < 3) uploadsByCompany[u.company_id].push(u);
    }
    payments = pays ?? [];
  }

  const totalCommissionEver = payments.reduce((s, p) => s + Number(p.price) * Number(p.commission_rate ?? 0.25), 0);
  const thisMonthPrefix = new Date().toISOString().slice(0, 7);
  const thisMonthCommission = payments
    .filter((p) => (p.period_start || "").startsWith(thisMonthPrefix))
    .reduce((s, p) => s + Number(p.price) * Number(p.commission_rate ?? 0.25), 0);

  const companyRows = (companies ?? [])
    .map((c) => {
      const sub = subsByCompany[c.id];
      const statusKey = sub?.status ?? "trial";
      const uploads = uploadsByCompany[c.id] ?? [];
      const uploadsHtml =
        uploads.length === 0
          ? `<div class="upload-item">Még nincs feltöltés.</div>`
          : uploads
              .map(
                (u) =>
                  `<div class="upload-item">${UPLOAD_KIND_LABELS[u.kind] || u.kind} — ${u.file_name} (${new Date(u.created_at).toLocaleDateString("hu-HU")}, ${u.status})</div>`
              )
              .join("");
      return `
      <div class="company-row">
        <div class="company-top">
          <div>
            <div class="company-name">${c.name}</div>
            <div class="company-tax">${(c.tax_number || "").replace(/-/g, "  ")}</div>
          </div>
          <div class="status-badge status-${statusKey}">${STATUS_LABELS[statusKey] || statusKey}${sub?.tier ? " · " + (TIER_LABELS[sub.tier] || sub.tier) : ""}</div>
        </div>
        <div class="upload-list">${uploadsHtml}</div>
      </div>`;
    })
    .join("");

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>Az ajánlói kódod</h2>
      <div class="referral-box">
        <div class="referral-code" id="referralCodeText">${accountant.referral_code}</div>
        <button class="copy-btn" id="copyCodeBtn">Másolás</button>
        <div style="font-size:0.8rem; color:var(--ink-soft); flex-basis:100%;">Add ezt a kódot az ügyfeleidnek — a regisztrációnál be tudják írni, és onnantól a havi előfizetési díjuk ${currentRatePct}%-át megkapod, amíg előfizetnek.</div>
      </div>
    </div>

    <div class="card">
      <h2>Jutalék <span style="font-size:0.75rem; font-weight:400; color:var(--ink-faint);">(jelenlegi kulcs: ${currentRatePct}%)</span></h2>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${Math.round(thisMonthCommission).toLocaleString("hu-HU")} Ft</div><div class="stat-label">Ebben a hónapban</div></div>
        <div class="stat-box"><div class="stat-num">${Math.round(totalCommissionEver).toLocaleString("hu-HU")} Ft</div><div class="stat-label">Összesen eddig</div></div>
        <div class="stat-box"><div class="stat-num">${companies?.length ?? 0}</div><div class="stat-label">Ajánlott cég</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Ajánlott cégek</h2>
      ${companyRows || `<div class="empty-state">Még nincs általad ajánlott cég — oszd meg a kódodat!</div>`}
    </div>
  `;

  document.getElementById("copyCodeBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(accountant.referral_code).then(() => {
      const btn = document.getElementById("copyCodeBtn");
      btn.textContent = "Másolva!";
      setTimeout(() => (btn.textContent = "Másolás"), 1500);
    });
  });

  document.getElementById("loadingBox").style.display = "none";
  document.getElementById("content").style.display = "block";
}

main();
</script>
</body>
</html>
