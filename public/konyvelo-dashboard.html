<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Könyvelői felület — Cégfókusz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f5fa; --surface: #ffffff;
    --surface-sidebar: #0f1a33; --surface-sidebar-hover: #182746;
    --ink: #12172b; --ink-soft: #5a6178; --ink-faint: #9297ab;
    --line: #e6e8f0; --accent: #1f3a7a; --accent-soft: #e9edf7; --accent-ink: #ffffff;
    --on-sidebar: #d8d9ec; --on-sidebar-soft: #7c7f9e;
    --danger: #b3261e; --danger-soft: #fbeceb; --ok: #1a7f4e; --ok-soft: #e8f5ee;
    --warn: #a4650a; --warn-soft: #faf1e3;
    --shadow: 0 1px 2px rgba(20,21,42,0.04), 0 8px 24px rgba(20,21,42,0.05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; display: flex; min-height: 100vh; }

  .sidebar { width: 232px; flex-shrink: 0; background: var(--surface-sidebar); color: var(--on-sidebar); display: flex; flex-direction: column; padding: 1.5rem 1rem; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem; margin-bottom: 2.2rem; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(155deg, #3f5fac, var(--accent)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-mark img { width: 20px; height: 20px; }
  .brand-name { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.01em; color: #fff; }
  .brand-sub { font-size: 0.68rem; color: var(--on-sidebar-soft); margin-top: 0.1rem; }

  .nav-group-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--on-sidebar-soft); padding: 0 0.6rem; margin: 0 0 0.5rem; }
  nav.nav { display: flex; flex-direction: column; gap: 0.15rem; margin-bottom: 1.6rem; }
  .nav-link { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.6rem; border-radius: 8px; color: var(--on-sidebar-soft); text-decoration: none; font-size: 0.87rem; font-weight: 500; }
  .nav-link svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.85; }
  .nav-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }
  .nav-link.active { background: var(--surface-sidebar-hover); color: #fff; }
  .nav-link.active svg { opacity: 1; color: #7093e8; }

  .sidebar-foot { margin-top: auto; }
  .logout-link { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.8rem; color: var(--on-sidebar-soft); text-decoration: none; background: none; border: none; cursor: pointer; font-family: var(--sans); width: 100%; text-align: left; }
  .logout-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }
  .logout-link svg { width: 15px; height: 15px; flex-shrink: 0; }

  main { flex: 1; min-width: 0; }
  .wrap { max-width: 860px; padding: 1.8rem 2.2rem 4rem; }
  h1 { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; margin: 0 0 0.3rem; }
  .page-desc { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 1.4rem; line-height: 1.5; }

  .loading { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); font-size: 0.9rem; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1.3rem 1.4rem; margin-bottom: 1.2rem; }
  .card h2 { font-size: 0.9rem; margin: 0 0 0.7rem; }

  .referral-box { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .referral-code { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); background: var(--accent-soft); padding: 0.5rem 1rem; border-radius: 10px; }
  .copy-btn { font-size: 0.8rem; font-weight: 600; padding: 0.5rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; }
  .copy-btn:hover { background: var(--accent-soft); }

  .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 140px; background: var(--ground); border-radius: 10px; padding: 0.9rem 1rem; }
  .stat-num { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; }
  .stat-label { font-size: 0.74rem; color: var(--ink-soft); margin-top: 0.15rem; }

  .company-row { border-top: 1px solid var(--line); padding: 0.9rem 0; }
  .company-row:first-child { border-top: none; }
  .company-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem; }
  .company-name { font-size: 0.92rem; font-weight: 700; }
  .company-tax { font-size: 0.74rem; color: var(--ink-faint); margin-top: 0.1rem; }
  .status-badge { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; white-space: nowrap; }
  .status-trial { background: var(--accent-soft); color: var(--accent); }
  .status-active { background: var(--ok-soft); color: var(--ok); }
  .status-past_due { background: var(--danger-soft); color: var(--danger); }

  .flag-link { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.8rem; padding: 0.5rem 0.6rem; border-radius: 8px; text-decoration: none; margin-top: 0.4rem; line-height: 1.4; }
  .flag-link.flag-warn { background: var(--warn-soft); color: #7a4c08; }
  .flag-link.flag-ok { background: var(--ok-soft); color: #135a37; }
  .flag-link:hover { filter: brightness(0.97); }
  .flag-link .flag-arrow { margin-left: auto; flex-shrink: 0; font-weight: 700; opacity: 0.7; }

  .upload-list { margin-top: 0.6rem; font-size: 0.78rem; color: var(--ink-soft); }
  .upload-item { padding: 0.25rem 0; }
  .empty-state { text-align: center; padding: 2rem 1rem; color: var(--ink-soft); font-size: 0.85rem; }

  .open-docs-btn { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.9rem; background: var(--accent); color: #fff; text-decoration: none; padding: 0.55rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.83rem; }
  .open-docs-btn:hover { background: #17305f; }
  .open-docs-btn svg { width: 15px; height: 15px; }

  .client-nav-list { display: flex; flex-direction: column; gap: 0.1rem; margin-bottom: 1.6rem; max-height: 260px; overflow-y: auto; }
  .client-nav-link { display: flex; align-items: center; gap: 0.55rem; padding: 0.45rem 0.6rem; border-radius: 8px; color: var(--on-sidebar-soft); text-decoration: none; font-size: 0.82rem; }
  .client-nav-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }
  .client-nav-link .dot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; background: #7093e8; }
  .client-nav-link .dot.dot-warn { background: #e0a93f; }
  .client-nav-link .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .client-nav-empty { font-size: 0.78rem; color: var(--on-sidebar-soft); padding: 0.3rem 0.6rem; }

  @media (max-width: 820px) {
    .sidebar { display: none; }
    .wrap { padding-left: 1.2rem; padding-right: 1.2rem; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="index.html" style="text-decoration:none; color:inherit;">
      <div class="brand-mark"><img src="favicon.svg" alt=""></div>
      <div>
        <div class="brand-name">Cégfókusz</div>
        <div class="brand-sub">Könyvelői felület</div>
      </div>
    </a>

    <div class="nav-group-label">Menü</div>
    <nav class="nav">
      <a class="nav-link active" href="konyvelo-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Irányítópult
      </a>
      <a class="nav-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
        Főoldal
      </a>
    </nav>

    <div class="nav-group-label">Ügyfeleim</div>
    <div class="client-nav-list" id="clientNavList">
      <div class="client-nav-empty">Betöltés...</div>
    </div>

    <div class="sidebar-foot">
      <button class="logout-link" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Kijelentkezés
      </button>
    </div>
  </aside>

  <main>
    <div class="wrap">
      <h1>Könyvelői felület</h1>
      <div class="page-desc">Az általad ajánlott vállalkozások, az előfizetési állapotuk és a legutóbbi feltöltéseik — amint egy ügyfeled feltölt valamit, itt azonnal megjelenik.</div>
      <div id="loadingBox" class="loading">Betöltés...</div>

      <div id="content" style="display:none;"></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const TIER_LABELS = { sav1: "Alap sáv", sav2: "Közepes sáv", sav3: "Nagy sáv" };
const STATUS_LABELS = { trial: "Próbaidőszak", active: "Aktív előfizetés", past_due: "Elmaradt fizetés", canceled: "Lemondva" };
const UPLOAD_KIND_LABELS = { kobak_penztargep: "KOBAK pénztárgépes export", konyveloi_afa: "Könyvelői kimutatás", jarulek_osszesito: "Járulék utalási összesítő", egyeb: "Egyéb" };

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.href = "konyvelo-login.html";
});

async function main() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = "konyvelo-login.html";
    return;
  }

  const { data: accountant, error: accError } = await sb
    .from("accountants")
    .select("*")
    .eq("user_id", session.user.id)
    .maybeSingle();

  if (accError || !accountant) {
    document.getElementById("loadingBox").textContent = "Nem található könyvelői fiók ehhez a bejelentkezéshez.";
    return;
  }

  const { data: rateSetting } = await sb
    .from("platform_settings")
    .select("value")
    .eq("key", "accountant_commission_rate")
    .maybeSingle();
  const currentRatePct = Math.round((rateSetting ? parseFloat(rateSetting.value) : 0.25) * 100);

  const { data: companies } = await sb
    .from("companies")
    .select("id, name, tax_number, created_at")
    .eq("referred_by_accountant_id", accountant.id)
    .order("created_at", { ascending: false });

  const companyIds = (companies ?? []).map((c) => c.id);

  let subsByCompany = {};
  let uploadsByCompany = {};
  let payments = [];
  const HU_MONTHS = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

  async function findChildFolderId(companyId, parentId, name) {
    let q = sb.from("document_folders").select("id").eq("company_id", companyId).eq("name", name);
    q = parentId ? q.eq("parent_folder_id", parentId) : q.is("parent_folder_id", null);
    const { data } = await q.maybeSingle();
    return data?.id ?? null;
  }

  // Gyors áttekintés: van-e ebben a hónapban NAV-számla, de nincs hozzá
  // feltöltött dokumentum, illetve van-e kiugró eltérés beszerzés/
  // értékesítés között — ugyanaz a logika, mint a vállalkozói dashboardon/
  // Dokumentumok oldalon, csak röviden, igen/nem jelzéssel.
  async function computeOverviewFlags(companyId) {
    const now = new Date();
    const year = String(now.getFullYear());
    const month = HU_MONTHS[now.getMonth()];
    const monthStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)).toISOString().slice(0, 10);
    const today = now.toISOString().slice(0, 10);

    const [{ count: invoiceCount }, { data: purchaseRows }, { data: salesRows }, { data: opgRows }] = await Promise.all([
      sb.from("invoice_vat_lines").select("id", { count: "exact", head: true }).eq("company_id", companyId).gte("issue_date", monthStart).lte("issue_date", today),
      sb.from("invoice_vat_lines").select("net_amount").eq("company_id", companyId).eq("direction", "INBOUND").gte("issue_date", monthStart).lte("issue_date", today),
      sb.from("invoice_vat_lines").select("net_amount").eq("company_id", companyId).eq("direction", "OUTBOUND").gte("issue_date", monthStart).lte("issue_date", today),
      sb.from("opg_receipt_items").select("net_amount").eq("company_id", companyId).gte("transaction_at", monthStart).lte("transaction_at", today + "T23:59:59"),
    ]);

    let missingInvoiceDocs = false;
    let missingReason = "";
    if (invoiceCount && invoiceCount > 0) {
      const szamlakTop = await findChildFolderId(companyId, null, "Számlák");
      const szamlakYear = szamlakTop ? await findChildFolderId(companyId, szamlakTop, year) : null;
      const szamlakMonth = szamlakYear ? await findChildFolderId(companyId, szamlakYear, month) : null;
      let fileCount = 0;
      if (szamlakMonth) {
        const { count } = await sb.from("company_documents").select("id", { count: "exact", head: true }).eq("folder_id", szamlakMonth);
        fileCount = count ?? 0;
      }
      missingInvoiceDocs = fileCount === 0;
      if (missingInvoiceDocs) {
        missingReason = `${month}: ${invoiceCount} db NAV-tól ismert számla van, de a "Számlák" mappában még nincs feltöltve semmi ehhez a hónaphoz.`;
      }
    }

    const sum = (rows) => (rows ?? []).reduce((s, r) => s + Number(r.net_amount ?? 0), 0);
    const purchases = sum(purchaseRows);
    const sales = sum(salesRows) + sum(opgRows);
    const diff = Math.abs(sales - purchases);
    const higher = Math.max(sales, purchases);
    const lower = Math.min(sales, purchases);
    const ratio = lower === 0 ? (higher > 0 ? Infinity : 0) : higher / lower;
    const hasAnomaly = diff >= 50000 && ratio >= 2.5;
    const anomalyReason = hasAnomaly
      ? (sales > purchases
          ? `${month}: az értékesítés (${Math.round(sales).toLocaleString("hu-HU")} Ft) jelentősen meghaladja a beszerzést (${Math.round(purchases).toLocaleString("hu-HU")} Ft) — lehet, hogy hiányzik egy bejövő számla.`
          : `${month}: a beszerzés (${Math.round(purchases).toLocaleString("hu-HU")} Ft) jelentősen meghaladja az értékesítést (${Math.round(sales).toLocaleString("hu-HU")} Ft) — lehet, hogy hiányzik egy értékesítési tétel.`)
      : "";

    return { missingInvoiceDocs, missingReason, hasAnomaly, anomalyReason };
  }

  if (companyIds.length > 0) {
    const [{ data: subs }, { data: uploads }, { data: pays }] = await Promise.all([
      sb.from("subscriptions").select("company_id, status, tier, current_period_end").in("company_id", companyIds),
      sb.from("manual_data_uploads").select("company_id, kind, file_name, status, created_at").in("company_id", companyIds).order("created_at", { ascending: false }),
      sb.from("subscription_payments").select("company_id, price, period_start, commission_rate").in("company_id", companyIds),
    ]);
    for (const s of subs ?? []) subsByCompany[s.company_id] = s;
    for (const u of uploads ?? []) {
      uploadsByCompany[u.company_id] = uploadsByCompany[u.company_id] ?? [];
      if (uploadsByCompany[u.company_id].length < 3) uploadsByCompany[u.company_id].push(u);
    }
    payments = pays ?? [];
  }

  let flagsByCompany = {};
  if (companyIds.length > 0) {
    const flagResults = await Promise.all(companyIds.map((id) => computeOverviewFlags(id)));
    companyIds.forEach((id, i) => { flagsByCompany[id] = flagResults[i]; });
  }

  const totalCommissionEver = payments.reduce((s, p) => s + Number(p.price) * Number(p.commission_rate ?? 0.25), 0);
  const thisMonthPrefix = new Date().toISOString().slice(0, 7);
  const thisMonthCommission = payments
    .filter((p) => (p.period_start || "").startsWith(thisMonthPrefix))
    .reduce((s, p) => s + Number(p.price) * Number(p.commission_rate ?? 0.25), 0);

  // Sidebar: gyors ugrás bármelyik ügyfél Dokumentumok oldalára — ne csak
  // egy eldugott, apró linken keresztül lehessen elérni.
  const clientNavHtml = (companies ?? []).length === 0
    ? `<div class="client-nav-empty">Még nincs ajánlott céged.</div>`
    : (companies ?? [])
        .map((c) => {
          const flags = flagsByCompany[c.id] ?? {};
          const hasProblem = flags.missingInvoiceDocs || flags.hasAnomaly;
          return `<a class="client-nav-link" href="dokumentumok.html?company=${c.id}" title="${c.name}"><span class="dot ${hasProblem ? "dot-warn" : ""}"></span><span class="name">${c.name}</span></a>`;
        })
        .join("");
  document.getElementById("clientNavList").innerHTML = clientNavHtml;

  const companyRows = (companies ?? [])
    .map((c) => {
      const sub = subsByCompany[c.id];
      const statusKey = sub?.status ?? "trial";
      const uploads = uploadsByCompany[c.id] ?? [];
      const uploadsHtml =
        uploads.length === 0
          ? `<div class="upload-item">Még nincs feltöltés.</div>`
          : uploads
              .map(
                (u) =>
                  `<div class="upload-item">${UPLOAD_KIND_LABELS[u.kind] || u.kind} — ${u.file_name} (${new Date(u.created_at).toLocaleDateString("hu-HU")}, ${u.status})</div>`
              )
              .join("");

      const flags = flagsByCompany[c.id] ?? {};
      const flagLinks = [];
      if (flags.missingInvoiceDocs) {
        flagLinks.push(`<a class="flag-link flag-warn" href="dokumentumok.html?company=${c.id}"><span>📄 ${flags.missingReason}</span><span class="flag-arrow">→</span></a>`);
      }
      if (flags.hasAnomaly) {
        flagLinks.push(`<a class="flag-link flag-warn" href="dokumentumok.html?company=${c.id}"><span>⚠️ ${flags.anomalyReason}</span><span class="flag-arrow">→</span></a>`);
      }
      const flagsHtml = flagLinks.length > 0 ? flagLinks.join("") : `<div class="flag-link flag-ok"><span>✅ Ebben a hónapban nincs jelzett probléma.</span></div>`;

      return `
      <div class="company-row">
        <div class="company-top">
          <div>
            <div class="company-name">${c.name}</div>
            <div class="company-tax">${(c.tax_number || "").replace(/-/g, "  ")}</div>
          </div>
          <div class="status-badge status-${statusKey}">${STATUS_LABELS[statusKey] || statusKey}${sub?.tier ? " · " + (TIER_LABELS[sub.tier] || sub.tier) : ""}</div>
        </div>
        ${flagsHtml}
        <div class="upload-list">${uploadsHtml}</div>
        <a class="open-docs-btn" href="dokumentumok.html?company=${c.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          Dokumentumok megnyitása
        </a>
      </div>`;
    })
    .join("");

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>Az ajánlói kódod</h2>
      <div class="referral-box">
        <div class="referral-code" id="referralCodeText">${accountant.referral_code}</div>
        <button class="copy-btn" id="copyCodeBtn">Másolás</button>
        <div style="font-size:0.8rem; color:var(--ink-soft); flex-basis:100%;">Add ezt a kódot az ügyfeleidnek — a regisztrációnál be tudják írni, és onnantól a havi előfizetési díjuk ${currentRatePct}%-át megkapod, amíg előfizetnek.</div>
      </div>
    </div>

    <div class="card">
      <h2>Jutalék <span style="font-size:0.75rem; font-weight:400; color:var(--ink-faint);">(jelenlegi kulcs: ${currentRatePct}%)</span></h2>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${Math.round(thisMonthCommission).toLocaleString("hu-HU")} Ft</div><div class="stat-label">Ebben a hónapban</div></div>
        <div class="stat-box"><div class="stat-num">${Math.round(totalCommissionEver).toLocaleString("hu-HU")} Ft</div><div class="stat-label">Összesen eddig</div></div>
        <div class="stat-box"><div class="stat-num">${companies?.length ?? 0}</div><div class="stat-label">Ajánlott cég</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Ajánlott cégek <span style="font-size:0.75rem; font-weight:400; color:var(--ink-faint);">— ${new Date().toLocaleDateString("hu-HU", { month: "long" })}</span></h2>
      ${companyRows || `<div class="empty-state">Még nincs általad ajánlott cég — oszd meg a kódodat!</div>`}
    </div>
  `;

  document.getElementById("copyCodeBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(accountant.referral_code).then(() => {
      const btn = document.getElementById("copyCodeBtn");
      btn.textContent = "Másolva!";
      setTimeout(() => (btn.textContent = "Másolás"), 1500);
    });
  });

  document.getElementById("loadingBox").style.display = "none";
  document.getElementById("content").style.display = "block";
}

main();
</script>
