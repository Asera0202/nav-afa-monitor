<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adataim — Cégfókusz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4fb; --surface: #ffffff; --ink: #1a1b2e; --ink-soft: #6b7089;
    --line: #eaeaf3; --primary: #4f46e5; --primary-soft: #eef0fe;
    --ok: #16a34a; --ok-bg: #f0fdf4;
    --error: #dc2626; --error-bg: #fef2f2;
    --shadow: 0 1px 2px rgba(23,23,60,0.04), 0 6px 20px rgba(23,23,60,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

  .topnav { background: var(--surface); border-bottom: 1px solid var(--line); }
  .topnav-inner { max-width: 900px; margin: 0 auto; padding: 0.9rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
  .topnav .brand { display: flex; align-items: center; gap: 0.4rem; }
  .topnav .brand img { width: 38px; height: 38px; }
  .topnav .brand-name { font-weight: 700; font-size: 0.95rem; }
  .topnav .nav-links { display: flex; align-items: center; gap: 1.1rem; }
  .topnav .nav-links a, .topnav .nav-links button {
    font-family: "Inter", sans-serif; font-size: 0.85rem; color: var(--ink-soft); text-decoration: none;
    background: none; border: none; cursor: pointer; padding: 0;
  }
  .topnav .nav-links a.active { color: var(--primary); font-weight: 600; }
  .topnav .nav-links button:hover { color: var(--error); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 1.8rem 1.25rem 4rem; }
  h1 { font-size: 1.3rem; margin: 0 0 1.2rem; }

  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .tab-btn {
    font-family: "Inter", sans-serif; font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1rem;
    border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer;
  }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .filters { display: flex; gap: 0.8rem; align-items: end; margin-bottom: 1.2rem; flex-wrap: wrap; background: var(--surface); border-radius: 14px; padding: 1rem 1.2rem; box-shadow: var(--shadow); }
  .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .filter-group label { font-size: 0.76rem; color: var(--ink-soft); font-weight: 600; }
  .filter-group input {
    font-family: "Inter", sans-serif; font-size: 0.85rem; padding: 0.45rem 0.6rem;
    border: 1.5px solid var(--line); border-radius: 8px; background: #fafafe; color: var(--ink);
  }
  .filter-btn {
    font-family: "Inter", sans-serif; font-size: 0.85rem; font-weight: 700; padding: 0.5rem 1.1rem;
    border-radius: 8px; border: none; background: var(--primary); color: #fff; cursor: pointer;
  }

  .breadcrumb { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .breadcrumb button { font-family: "Inter", sans-serif; background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; padding: 0; font-size: 0.85rem; }
  .breadcrumb span.sep { color: var(--ink-soft); }
  .breadcrumb span.current { color: var(--ink-soft); }

  .summary-card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 1rem 1.2rem; margin-bottom: 1.2rem; display: flex; gap: 2rem; flex-wrap: wrap; }
  .summary-item .label { font-size: 0.75rem; color: var(--ink-soft); }
  .summary-item .value { font-size: 1.05rem; font-weight: 700; }

  .list-card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .list-row {
    display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.4rem 1.2rem; align-items: center;
    padding: 0.85rem 1.1rem; border-top: 1px solid var(--line); cursor: pointer;
  }
  .list-row:first-child { border-top: none; }
  .list-row:hover { background: var(--primary-soft); }
  .list-row .main-label { font-weight: 600; font-size: 0.88rem; }
  .list-row .sub-label { font-size: 0.75rem; color: var(--ink-soft); grid-column: 1; }
  .list-row .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
  .list-row .num-label { font-size: 0.68rem; color: var(--ink-soft); display: block; }
  .list-row .chevron { color: var(--ink-soft); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: left; padding: 0.65rem 0.9rem; font-size: 0.82rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #fafafe; color: var(--ink-soft); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--primary-soft); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; border-radius: 14px; }
  .loading, .empty-state { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); font-size: 0.9rem; }
  .cap-note { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.7rem; text-align: center; }
</style>
</head>
<body>
  <div class="topnav">
    <div class="topnav-inner">
      <div class="brand">
        <img src="favicon.svg" alt="Cégfókusz">
        <div class="brand-name">Cégfókusz</div>
      </div>
      <div class="nav-links">
        <a href="dashboard.html">Irányítópult</a>
        <a href="adataim.html" class="active">Adataim</a>
        <a href="beallitasok.html">Beállítások</a>
        <button id="logoutBtn">Kijelentkezés</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <h1>Adataim</h1>

    <div class="tabs">
      <button class="tab-btn active" data-type="opg">Pénztárgép</button>
      <button class="tab-btn" data-type="inbound">Bejövő számlák</button>
      <button class="tab-btn" data-type="outbound">Kimenő számlák</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label>Ettől</label>
        <input type="date" id="fromDate">
      </div>
      <div class="filter-group">
        <label>Eddig</label>
        <input type="date" id="toDate">
      </div>
      <button class="filter-btn" id="applyFilter">Szűrés</button>
    </div>

    <div id="content" class="loading">Betöltés...</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentType = "opg";
let companyId = null;
let allRows = [];
let view = "days";
let selectedDate = null;
let selectedGroupKey = null;
const FETCH_LIMIT = 3000;

function formatFt(n) {
  return Math.round(n ?? 0).toLocaleString("hu-HU") + " Ft";
}
function formatDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString("hu-HU", { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}
function dayKey(iso) {
  return (iso ?? "").slice(0, 10);
}
function defaultDates() {
  const to = new Date();
  const from = new Date();
  from.setDate(from.getDate() - 30);
  return { from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) };
}
function dateField() {
  return currentType === "opg" ? "transaction_at" : "issue_date";
}
function groupKeyField() {
  return currentType === "opg" ? "receipt_number" : "invoice_number";
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.href = "login.html";
});

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    loadData();
  });
});

document.getElementById("applyFilter").addEventListener("click", loadData);

async function loadData() {
  const content = document.getElementById("content");
  content.innerHTML = `<div class="loading">Betöltés...</div>`;
  view = "days";
  selectedDate = null;
  selectedGroupKey = null;

  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;

  try {
    if (currentType === "opg") {
      const { data, error } = await sb
        .from("opg_receipt_items")
        .select("transaction_at, receipt_number, item_index, vat_letter, vat_percentage, net_amount, vat_amount, gross_amount")
        .eq("company_id", companyId)
        .gte("transaction_at", from)
        .lte("transaction_at", to + "T23:59:59")
        .order("transaction_at", { ascending: false })
        .limit(FETCH_LIMIT);
      if (error) throw error;
      allRows = data ?? [];
    } else {
      const direction = currentType === "inbound" ? "INBOUND" : "OUTBOUND";
      const { data, error } = await sb
        .from("invoice_vat_lines")
        .select("issue_date, invoice_number, partner_name, vat_percentage, net_amount, vat_amount, gross_amount")
        .eq("company_id", companyId)
        .eq("direction", direction)
        .gte("issue_date", from)
        .lte("issue_date", to)
        .order("issue_date", { ascending: false })
        .limit(FETCH_LIMIT);
      if (error) throw error;
      allRows = data ?? [];
    }
    render();
  } catch (err) {
    content.innerHTML = `<div class="empty-state">Hiba történt az adatok betöltésekor: ${err.message}</div>`;
  }
}

function sumRows(rows) {
  return {
    net: rows.reduce((s, r) => s + Number(r.net_amount ?? 0), 0),
    vat: rows.reduce((s, r) => s + Number(r.vat_amount ?? 0), 0),
    gross: rows.reduce((s, r) => s + Number(r.gross_amount ?? 0), 0),
  };
}

function render() {
  if (allRows.length === 0) {
    document.getElementById("content").innerHTML = `<div class="empty-state">Nincs adat a kiválasztott időszakban.</div>`;
    return;
  }
  if (view === "days") renderDaysView();
  else if (view === "groups") renderGroupsView();
  else renderItemsView();
}

function renderDaysView() {
  const byDay = new Map();
  for (const row of allRows) {
    const key = dayKey(row[dateField()]);
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(row);
  }

  const days = [...byDay.keys()].sort((a, b) => (a < b ? 1 : -1));
  const groupField = groupKeyField();

  const rowsHtml = days
    .map((day) => {
      const rows = byDay.get(day);
      const groupCount = new Set(rows.map((r) => r[groupField])).size;
      const totals = sumRows(rows);
      const groupLabel = currentType === "opg" ? "nyugta" : "számla";
      return `
      <div class="list-row" data-day="${day}">
        <div>
          <div class="main-label">${formatDate(day)}</div>
          <div class="sub-label">${groupCount} ${groupLabel} · ${rows.length} tétel</div>
        </div>
        <div class="num"><span class="num-label">Nettó</span>${formatFt(totals.net)}</div>
        <div class="num"><span class="num-label">ÁFA</span>${formatFt(totals.vat)}</div>
        <div class="num"><span class="num-label">Bruttó</span>${formatFt(totals.gross)}</div>
      </div>`;
    })
    .join("");

  const grandTotals = sumRows(allRows);

  document.getElementById("content").innerHTML = `
    <div class="summary-card">
      <div class="summary-item"><div class="label">Napok száma</div><div class="value">${days.length}</div></div>
      <div class="summary-item"><div class="label">Összes nettó</div><div class="value">${formatFt(grandTotals.net)}</div></div>
      <div class="summary-item"><div class="label">Összes ÁFA</div><div class="value">${formatFt(grandTotals.vat)}</div></div>
      <div class="summary-item"><div class="label">Összes bruttó</div><div class="value">${formatFt(grandTotals.gross)}</div></div>
    </div>
    <div class="list-card">${rowsHtml}</div>
  `;

  document.querySelectorAll(".list-row[data-day]").forEach((el) => {
    el.addEventListener("click", () => {
      selectedDate = el.dataset.day;
      view = "groups";
      render();
    });
  });
}

function renderGroupsView() {
  const groupField = groupKeyField();
  const dayRows = allRows.filter((r) => dayKey(r[dateField()]) === selectedDate);

  const byGroup = new Map();
  for (const row of dayRows) {
    const key = row[groupField] ?? "(ismeretlen)";
    if (!byGroup.has(key)) byGroup.set(key, []);
    byGroup.get(key).push(row);
  }

  const groupKeys = [...byGroup.keys()].sort();
  const groupLabel = currentType === "opg" ? "Nyugtaszám" : "Számlaszám";

  const rowsHtml = groupKeys
    .map((key) => {
      const rows = byGroup.get(key);
      const totals = sumRows(rows);
      const partner = currentType !== "opg" ? (rows[0].partner_name || "") : "";
      const subLabel = currentType === "opg" ? `${rows.length} tétel` : (partner || `${rows.length} ÁFA-kulcs`);
      return `
      <div class="list-row" data-group="${encodeURIComponent(key)}">
        <div>
          <div class="main-label">${key}</div>
          <div class="sub-label">${subLabel}</div>
        </div>
        <div class="num"><span class="num-label">Nettó</span>${formatFt(totals.net)}</div>
        <div class="num"><span class="num-label">ÁFA</span>${formatFt(totals.vat)}</div>
        <div class="num"><span class="num-label">Bruttó</span>${formatFt(totals.gross)}</div>
      </div>`;
    })
    .join("");

  const dayTotals = sumRows(dayRows);

  document.getElementById("content").innerHTML = `
    <div class="breadcrumb">
      <button id="backToDays">Napok</button>
      <span class="sep">›</span>
      <span class="current">${formatDate(selectedDate)}</span>
    </div>
    <div class="summary-card">
      <div class="summary-item"><div class="label">${groupLabel === "Nyugtaszám" ? "Nyugták" : "Számlák"}</div><div class="value">${groupKeys.length}</div></div>
      <div class="summary-item"><div class="label">Összes nettó</div><div class="value">${formatFt(dayTotals.net)}</div></div>
      <div class="summary-item"><div class="label">Összes ÁFA</div><div class="value">${formatFt(dayTotals.vat)}</div></div>
      <div class="summary-item"><div class="label">Összes bruttó</div><div class="value">${formatFt(dayTotals.gross)}</div></div>
    </div>
    <div class="list-card">${rowsHtml}</div>
  `;

  document.getElementById("backToDays").addEventListener("click", () => {
    view = "days";
    render();
  });
  document.querySelectorAll(".list-row[data-group]").forEach((el) => {
    el.addEventListener("click", () => {
      selectedGroupKey = decodeURIComponent(el.dataset.group);
      view = "items";
      render();
    });
  });
}

function renderItemsView() {
  const groupField = groupKeyField();
  const rows = allRows.filter(
    (r) => dayKey(r[dateField()]) === selectedDate && (r[groupField] ?? "(ismeretlen)") === selectedGroupKey
  );

  let columns;
  if (currentType === "opg") {
    columns = [
      { key: "vat_letter", label: "ÁFA-kulcs" },
      { key: "net_amount", label: "Nettó", num: true, fmt: formatFt },
      { key: "vat_amount", label: "ÁFA", num: true, fmt: formatFt },
      { key: "gross_amount", label: "Bruttó", num: true, fmt: formatFt },
    ];
  } else {
    columns = [
      { key: "vat_percentage", label: "ÁFA%", fmt: (v) => `${Math.round((v ?? 0) * 100)}%` },
      { key: "net_amount", label: "Nettó", num: true, fmt: formatFt },
      { key: "vat_amount", label: "ÁFA", num: true, fmt: formatFt },
      { key: "gross_amount", label: "Bruttó", num: true, fmt: formatFt },
    ];
  }

  const headerHtml = columns.map((c) => `<th${c.num ? ' class="num"' : ""}>${c.label}</th>`).join("");
  const rowsHtml = rows
    .map((row) => {
      const cells = columns
        .map((c) => {
          const raw = row[c.key];
          const val = c.fmt ? c.fmt(raw) : raw ?? "";
          return `<td${c.num ? ' class="num"' : ""}>${val}</td>`;
        })
        .join("");
      return `<tr>${cells}</tr>`;
    })
    .join("");

  const totals = sumRows(rows);
  const groupLabelType = currentType === "opg" ? "Nyugta" : "Számla";

  document.getElementById("content").innerHTML = `
    <div class="breadcrumb">
      <button id="backToDays">Napok</button>
      <span class="sep">›</span>
      <button id="backToGroups">${formatDate(selectedDate)}</button>
      <span class="sep">›</span>
      <span class="current">${groupLabelType}: ${selectedGroupKey}</span>
    </div>
    <div class="summary-card">
      <div class="summary-item"><div class="label">Tételek</div><div class="value">${rows.length}</div></div>
      <div class="summary-item"><div class="label">Nettó</div><div class="value">${formatFt(totals.net)}</div></div>
      <div class="summary-item"><div class="label">ÁFA</div><div class="value">${formatFt(totals.vat)}</div></div>
      <div class="summary-item"><div class="label">Bruttó</div><div class="value">${formatFt(totals.gross)}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>${headerHtml}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;

  document.getElementById("backToDays").addEventListener("click", () => {
    view = "days";
    render();
  });
  document.getElementById("backToGroups").addEventListener("click", () => {
    view = "groups";
    render();
  });
}

async function main() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = "login.html";
    return;
  }

  const { data: companies, error } = await sb.from("companies").select("id");
  if (error || !companies || companies.length === 0) {
    document.getElementById("content").innerHTML = `<div class="empty-state">A regisztrációdat még átnézzük és aktiváljuk — addig itt még nincs mit mutatni.</div>`;
    return;
  }
  companyId = companies[0].id;

  const { from, to } = defaultDates();
  document.getElementById("fromDate").value = from;
  document.getElementById("toDate").value = to;

  loadData();
}

main();
</script>
</body>
</html>
