<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adataim — Cégfókusz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f5fa; --surface: #ffffff;
    --surface-sidebar: #0f1a33; --surface-sidebar-hover: #182746;
    --ink: #12172b; --ink-soft: #5a6178; --ink-faint: #9297ab;
    --line: #e6e8f0; --accent: #1f3a7a; --accent-soft: #e9edf7; --accent-ink: #ffffff;
    --on-sidebar: #d8d9ec; --on-sidebar-soft: #7c7f9e;
    --ok: #1a7f4e; --ok-soft: #e8f5ee;
    --shadow: 0 1px 2px rgba(20,21,42,0.04), 0 8px 24px rgba(20,21,42,0.05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar { width: 232px; flex-shrink: 0; background: var(--surface-sidebar); color: var(--on-sidebar); display: flex; flex-direction: column; padding: 1.5rem 1rem; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem; margin-bottom: 2.2rem; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(155deg, #3f5fac, var(--accent)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-mark img { width: 20px; height: 20px; }
  .brand-name { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.01em; color: #fff; }

  .nav-group-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--on-sidebar-soft); padding: 0 0.6rem; margin: 0 0 0.5rem; }
  nav.nav { display: flex; flex-direction: column; gap: 0.15rem; margin-bottom: 1.6rem; }
  .nav-link { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.6rem; border-radius: 8px; color: var(--on-sidebar-soft); text-decoration: none; font-size: 0.87rem; font-weight: 500; }
  .nav-link svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.85; }
  .nav-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }
  .nav-link.active { background: var(--surface-sidebar-hover); color: #fff; }
  .nav-link.active svg { opacity: 1; color: #7093e8; }

  .sidebar-foot { margin-top: auto; }
  .id-card { position: relative; border-radius: 12px; padding: 0.95rem 1rem; background: linear-gradient(150deg, #1c2c52, #0a1226 88%); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
  .id-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120px 90px at 100% 0%, rgba(112,147,232,0.22), transparent 70%); pointer-events: none; }
  .id-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.1rem; }
  .id-chip { width: 22px; height: 16px; border-radius: 3px; background: linear-gradient(160deg, #c9d3ec, #8b96b8); }
  .id-status { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8fe3b0; display: flex; align-items: center; gap: 0.3rem; }
  .id-status .dot { width: 5px; height: 5px; border-radius: 999px; background: #3fcb84; flex-shrink: 0; }
  .id-card-number { font-family: var(--sans); font-variant-numeric: tabular-nums; letter-spacing: 0.09em; font-size: 0.86rem; color: #eef0fa; margin-bottom: 0.7rem; }
  .id-card-name { font-size: 0.82rem; font-weight: 600; color: #fff; }
  .id-card-sub { font-size: 0.68rem; color: #8992b8; margin-top: 0.1rem; }

  .trust-note { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.9rem; padding: 0 0.3rem; font-size: 0.68rem; color: var(--on-sidebar-soft); }
  .trust-note svg { width: 12px; height: 12px; flex-shrink: 0; }

  .logout-link { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.8rem; color: var(--on-sidebar-soft); text-decoration: none; background: none; border: none; cursor: pointer; font-family: var(--sans); width: 100%; text-align: left; }
  .logout-link:hover { background: var(--surface-sidebar-hover); color: var(--on-sidebar); }
  .logout-link svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* ---------- Main ---------- */
  main { flex: 1; min-width: 0; }
  .wrap { max-width: 980px; padding: 1.8rem 2.2rem 4rem; }
  h1 { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; margin: 0 0 1.2rem; }

  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .tab-btn {
    font-family: var(--sans); font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1rem;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .filters { display: flex; gap: 0.8rem; align-items: end; margin-bottom: 1.2rem; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.2rem; box-shadow: var(--shadow); }
  .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .filter-group label { font-size: 0.76rem; color: var(--ink-soft); font-weight: 600; }
  .filter-group input, .filter-group select {
    font-family: var(--sans); font-size: 0.85rem; padding: 0.45rem 0.6rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--ground); color: var(--ink);
  }
  .filter-btn {
    font-family: var(--sans); font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1.1rem;
    border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .export-btn {
    font-family: var(--sans); font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1.1rem;
    border-radius: 8px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer;
  }
  .export-btn:disabled { opacity: 0.55; cursor: default; }

  .breadcrumb { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .breadcrumb button { font-family: var(--sans); background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 0.85rem; }
  .breadcrumb span.sep { color: var(--ink-faint); }
  .breadcrumb span.current { color: var(--ink-soft); }

  .summary-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1rem 1.2rem; margin-bottom: 1.2rem; display: flex; gap: 2rem; flex-wrap: wrap; }
  .summary-item .label { font-size: 0.75rem; color: var(--ink-faint); }
  .summary-item .value { font-family: var(--serif); font-size: 1.15rem; font-variant-numeric: tabular-nums; }

  .list-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .list-row {
    display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.4rem 1.2rem; align-items: center;
    padding: 0.85rem 1.1rem; border-top: 1px solid var(--line); cursor: pointer;
  }
  .list-row:first-child { border-top: none; }
  .list-row:hover { background: var(--accent-soft); }
  .list-row .main-label { font-weight: 600; font-size: 0.88rem; }
  .list-row .sub-label { font-size: 0.75rem; color: var(--ink-faint); grid-column: 1; }
  .list-row .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
  .list-row .num-label { font-size: 0.68rem; color: var(--ink-faint); display: block; }
  .list-row .chevron { color: var(--ink-soft); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: left; padding: 0.65rem 0.9rem; font-size: 0.82rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--ground); color: var(--ink-faint); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--accent-soft); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
  .table-wrap table { border: none; box-shadow: none; border-radius: 0; }
  .loading, .empty-state { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); font-size: 0.9rem; }
  .cap-note { font-size: 0.78rem; color: var(--ink-faint); margin-top: 0.7rem; text-align: center; }

  @media (max-width: 820px) {
    .sidebar { display: none; }
    .wrap { padding-left: 1.2rem; padding-right: 1.2rem; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="favicon.svg" alt=""></div>
      <div class="brand-name">Cégfókusz</div>
    </div>

    <div class="nav-group-label">Menü</div>
    <nav class="nav">
      <a class="nav-link" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Irányítópult
      </a>
      <a class="nav-link active" href="adataim.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v6h6"/></svg>
        Adataim
      </a>
      <a class="nav-link" href="beallitasok.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>

    <div class="sidebar-foot">
      <div class="id-card">

          <div class="id-chip"></div>

        </div>
        <div class="id-card-number" id="sidebarTaxNumber">····&nbsp;····&nbsp;·&nbsp;··</div>
        <div class="id-card-name" id="sidebarCompanyName">Betöltés…</div>
        <div class="id-card-sub">Adószám · regisztrált cég</div>
      </div>
      <div class="trust-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Biztonságos, titkosított kapcsolat
      </div>
      <button class="logout-link" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Kijelentkezés
      </button>
    </div>
  </aside>

  <main>
    <div class="wrap">
      <h1>Adataim</h1>

      <div class="tabs">
        <button class="tab-btn active" data-type="opg">Pénztárgép</button>
        <button class="tab-btn" data-type="inbound">Bejövő számlák</button>
        <button class="tab-btn" data-type="outbound">Kimenő számlák</button>

      <div class="filters">
        <div class="filter-group" id="registerFilterGroup" style="display:none;">
          <label>Pénztárgép</label>
          <select id="registerFilter">
            <option value="">Összes pénztárgép</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Ettől</label>
          <input type="date" id="fromDate">
        </div>
        <div class="filter-group">
          <label>Eddig</label>
          <input type="date" id="toDate">
        </div>
        <button class="filter-btn" id="applyFilter">Szűrés</button>
        <button class="export-btn" id="exportExcelBtn">Excel exportálása</button>
      </div>

      <div id="content" class="loading">Betöltés...</div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentType = "opg";
let companyId = null;
let allRows = [];
let view = "days";
let selectedDate = null;
let selectedGroupKey = null;
const FETCH_LIMIT = 3000;

function formatFt(n) {
  return Math.round(n ?? 0).toLocaleString("hu-HU") + " Ft";
}
function formatDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString("hu-HU", { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}
function dayKey(iso) {
  return (iso ?? "").slice(0, 10);
}
function defaultDates() {
  const to = new Date();
  const from = new Date();
  from.setDate(from.getDate() - 30);
  return { from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) };
}
function dateField() {
  return currentType === "opg" ? "transaction_at" : "issue_date";
}
function groupKeyField() {
  return currentType === "opg" ? "receipt_number" : "invoice_number";
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.href = "login.html";
});

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    document.getElementById("registerFilterGroup").style.display = currentType === "opg" ? "flex" : "none";
    loadData();
  });
});

document.getElementById("applyFilter").addEventListener("click", loadData);

function exportToExcel() {
  if (allRows.length === 0) {
    alert("Nincs exportálható adat a kiválasztott időszakban.");
    return;
  }

  let headers, rows;
  if (currentType === "opg") {
    headers = ["Dátum", "Nyugtaszám", "Tétel sorszám", "Pénztárgép", "ÁFA-kulcs", "ÁFA%", "Nettó", "ÁFA", "Bruttó"];
    rows = allRows.map((r) => [
      formatDate(r.transaction_at),
      r.receipt_number,
      r.item_index,
      r.ap_number,
      r.vat_letter,
      Math.round((r.vat_percentage ?? 0) * 100) / 100,
      r.net_amount,
      r.vat_amount,
      r.gross_amount,
    ]);
  } else {
    headers = ["Dátum", "Számlaszám", "Partner", "ÁFA%", "Nettó", "ÁFA", "Bruttó"];
    rows = allRows.map((r) => [
      formatDate(r.issue_date),
      r.invoice_number,
      r.partner_name ?? "",
      Math.round((r.vat_percentage ?? 0) * 100) / 100,
      r.net_amount,
      r.vat_amount,
      r.gross_amount,
    ]);
  }

  const worksheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const workbook = XLSX.utils.book_new();
  const sheetName = currentType === "opg" ? "Pénztárgép" : currentType === "inbound" ? "Bejövő számlák" : "Kimenő számlák";
  XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);

  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  XLSX.writeFile(workbook, `cegfokusz-${currentType}_${from}_${to}.xlsx`);
}

document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);

async function loadData() {
  const content = document.getElementById("content");
  content.innerHTML = `<div class="loading">Betöltés...</div>`;
  view = "days";
  selectedDate = null;
  selectedGroupKey = null;

  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;

  try {
    if (currentType === "opg") {
      let query = sb
        .from("opg_receipt_items")
        .select("transaction_at, receipt_number, item_index, ap_number, vat_letter, vat_percentage, net_amount, vat_amount, gross_amount")
        .eq("company_id", companyId)
        .gte("transaction_at", from)
        .lte("transaction_at", to + "T23:59:59");

      const selectedRegister = document.getElementById("registerFilter").value;
      if (selectedRegister) query = query.eq("ap_number", selectedRegister);

      const { data, error } = await query.order("transaction_at", { ascending: false })
        .limit(FETCH_LIMIT);
      if (error) throw error;
      allRows = data ?? [];
    } else {
      const direction = currentType === "inbound" ? "INBOUND" : "OUTBOUND";
      const { data, error } = await sb
        .from("invoice_vat_lines")
        .select("issue_date, invoice_number, partner_name, vat_percentage, net_amount, vat_amount, gross_amount")
        .eq("company_id", companyId)
        .eq("direction", direction)
        .gte("issue_date", from)
        .lte("issue_date", to)
        .order("issue_date", { ascending: false })
        .limit(FETCH_LIMIT);
      if (error) throw error;
      allRows = data ?? [];
    }
    render();
  } catch (err) {
    content.innerHTML = `<div class="empty-state">Hiba történt az adatok betöltésekor: ${err.message}</div>`;
  }
}

function sumRows(rows) {
  return {
    net: rows.reduce((s, r) => s + Number(r.net_amount ?? 0), 0),
    vat: rows.reduce((s, r) => s + Number(r.vat_amount ?? 0), 0),
    gross: rows.reduce((s, r) => s + Number(r.gross_amount ?? 0), 0),
  };
}

function render() {
  if (allRows.length === 0) {
    document.getElementById("content").innerHTML = `<div class="empty-state">Nincs adat a kiválasztott időszakban.</div>`;
    return;
  }
  if (view === "days") renderDaysView();
  else if (view === "groups") renderGroupsView();
  else renderItemsView();
}

function renderDaysView() {
  const byDay = new Map();
  for (const row of allRows) {
    const key = dayKey(row[dateField()]);
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(row);
  }

  const days = [...byDay.keys()].sort((a, b) => (a < b ? 1 : -1));
  const groupField = groupKeyField();

  const rowsHtml = days
    .map((day) => {
      const rows = byDay.get(day);
      const groupCount = new Set(rows.map((r) => r[groupField])).size;
      const totals = sumRows(rows);
      const groupLabel = currentType === "opg" ? "nyugta" : "számla";
      return `
      <div class="list-row" data-day="${day}">
        <div>
          <div class="main-label">${formatDate(day)}</div>
          <div class="sub-label">${groupCount} ${groupLabel} · ${rows.length} tétel</div>
        </div>
        <div class="num"><span class="num-label">Nettó</span>${formatFt(totals.net)}</div>
        <div class="num"><span class="num-label">ÁFA</span>${formatFt(totals.vat)}</div>
        <div class="num"><span class="num-label">Bruttó</span>${formatFt(totals.gross)}</div>
      </div>`;
    })
    .join("");

  const grandTotals = sumRows(allRows);

  document.getElementById("content").innerHTML = `
    <div class="summary-card">
      <div class="summary-item"><div class="label">Napok száma</div><div class="value">${days.length}</div></div>
      <div class="summary-item"><div class="label">Összes nettó</div><div class="value">${formatFt(grandTotals.net)}</div></div>
      <div class="summary-item"><div class="label">Összes ÁFA</div><div class="value">${formatFt(grandTotals.vat)}</div></div>
      <div class="summary-item"><div class="label">Összes bruttó</div><div class="value">${formatFt(grandTotals.gross)}</div></div>
    </div>
    <div class="list-card">${rowsHtml}</div>
  `;

  document.querySelectorAll(".list-row[data-day]").forEach((el) => {
    el.addEventListener("click", () => {
      selectedDate = el.dataset.day;
      view = "groups";
      render();
    });
  });
}

function renderGroupsView() {
  const groupField = groupKeyField();
  const dayRows = allRows.filter((r) => dayKey(r[dateField()]) === selectedDate);

  const byGroup = new Map();
  for (const row of dayRows) {
    const key = row[groupField] ?? "(ismeretlen)";
    if (!byGroup.has(key)) byGroup.set(key, []);
    byGroup.get(key).push(row);
  }

  const groupKeys = [...byGroup.keys()].sort();
  const groupLabel = currentType === "opg" ? "Nyugtaszám" : "Számlaszám";

  const rowsHtml = groupKeys
    .map((key) => {
      const rows = byGroup.get(key);
      const totals = sumRows(rows);
      const partner = currentType !== "opg" ? (rows[0].partner_name || "") : "";
      const subLabel = currentType === "opg" ? `${rows.length} tétel` : (partner || `${rows.length} ÁFA-kulcs`);
      return `
      <div class="list-row" data-group="${encodeURIComponent(key)}">
        <div>
          <div class="main-label">${key}</div>
          <div class="sub-label">${subLabel}</div>
        </div>
        <div class="num"><span class="num-label">Nettó</span>${formatFt(totals.net)}</div>
        <div class="num"><span class="num-label">ÁFA</span>${formatFt(totals.vat)}</div>
        <div class="num"><span class="num-label">Bruttó</span>${formatFt(totals.gross)}</div>
      </div>`;
    })
    .join("");

  const dayTotals = sumRows(dayRows);

  document.getElementById("content").innerHTML = `
    <div class="breadcrumb">
      <button id="backToDays">Napok</button>
      <span class="sep">›</span>
      <span class="current">${formatDate(selectedDate)}</span>
    </div>
    <div class="summary-card">
      <div class="summary-item"><div class="label">${groupLabel === "Nyugtaszám" ? "Nyugták" : "Számlák"}</div><div class="value">${groupKeys.length}</div></div>
      <div class="summary-item"><div class="label">Összes nettó</div><div class="value">${formatFt(dayTotals.net)}</div></div>
      <div class="summary-item"><div class="label">Összes ÁFA</div><div class="value">${formatFt(dayTotals.vat)}</div></div>
      <div class="summary-item"><div class="label">Összes bruttó</div><div class="value">${formatFt(dayTotals.gross)}</div></div>
    </div>
    <div class="list-card">${rowsHtml}</div>
  `;

  document.getElementById("backToDays").addEventListener("click", () => {
    view = "days";
    render();
  });
  document.querySelectorAll(".list-row[data-group]").forEach((el) => {
    el.addEventListener("click", () => {
      selectedGroupKey = decodeURIComponent(el.dataset.group);
      view = "items";
      render();
    });
  });
}

function renderItemsView() {
  const groupField = groupKeyField();
  const rows = allRows.filter(
    (r) => dayKey(r[dateField()]) === selectedDate && (r[groupField] ?? "(ismeretlen)") === selectedGroupKey
  );

  let columns;
  if (currentType === "opg") {
    columns = [
      { key: "ap_number", label: "Pénztárgép" },
      { key: "vat_letter", label: "ÁFA-kulcs" },
      { key: "net_amount", label: "Nettó", num: true, fmt: formatFt },
      { key: "vat_amount", label: "ÁFA", num: true, fmt: formatFt },
      { key: "gross_amount", label: "Bruttó", num: true, fmt: formatFt },
    ];
  } else {
    columns = [
      { key: "vat_percentage", label: "ÁFA%", fmt: (v) => `${Math.round((v ?? 0) * 100)}%` },
      { key: "net_amount", label: "Nettó", num: true, fmt: formatFt },
      { key: "vat_amount", label: "ÁFA", num: true, fmt: formatFt },
      { key: "gross_amount", label: "Bruttó", num: true, fmt: formatFt },
    ];
  }

  const headerHtml = columns.map((c) => `<th${c.num ? ' class="num"' : ""}>${c.label}</th>`).join("");
  const rowsHtml = rows
    .map((row) => {
      const cells = columns
        .map((c) => {
          const raw = row[c.key];
          const val = c.fmt ? c.fmt(raw) : raw ?? "";
          return `<td${c.num ? ' class="num"' : ""}>${val}</td>`;
        })
        .join("");
      return `<tr>${cells}</tr>`;
    })
    .join("");

  const totals = sumRows(rows);
  const groupLabelType = currentType === "opg" ? "Nyugta" : "Számla";

  document.getElementById("content").innerHTML = `
    <div class="breadcrumb">
      <button id="backToDays">Napok</button>
      <span class="sep">›</span>
      <button id="backToGroups">${formatDate(selectedDate)}</button>
      <span class="sep">›</span>
      <span class="current">${groupLabelType}: ${selectedGroupKey}</span>
    </div>
    <div class="summary-card">
      <div class="summary-item"><div class="label">Tételek</div><div class="value">${rows.length}</div></div>
      <div class="summary-item"><div class="label">Nettó</div><div class="value">${formatFt(totals.net)}</div></div>
      <div class="summary-item"><div class="label">ÁFA</div><div class="value">${formatFt(totals.vat)}</div></div>
      <div class="summary-item"><div class="label">Bruttó</div><div class="value">${formatFt(totals.gross)}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>${headerHtml}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;

  document.getElementById("backToDays").addEventListener("click", () => {
    view = "days";
    render();
  });
  document.getElementById("backToGroups").addEventListener("click", () => {
    view = "groups";
    render();
  });
}

async function main() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = "login.html";
    return;
  }

  const { data: companies, error } = await sb.from("companies").select("id, name, tax_number");
  if (error || !companies || companies.length === 0) {
    document.getElementById("content").innerHTML = `<div class="empty-state">A regisztrációdat még átnézzük és aktiváljuk — addig itt még nincs mit mutatni.</div>`;
    return;
  }
  companyId = companies[0].id;
  document.getElementById("sidebarCompanyName").textContent = companies[0].name;
  document.getElementById("sidebarTaxNumber").textContent = companies[0].tax_number.replace(/-/g, "  ");

  const { data: registers } = await sb.from("cash_registers").select("ap_number").eq("company_id", companyId).order("ap_number");
  if (registers && registers.length > 0) {
    const select = document.getElementById("registerFilter");
    for (const r of registers) {
      const opt = document.createElement("option");
      opt.value = r.ap_number;
      opt.textContent = r.ap_number;
      select.appendChild(opt);
    }
  }
  document.getElementById("registerFilterGroup").style.display = currentType === "opg" ? "flex" : "none";
  document.getElementById("registerFilter").addEventListener("change", loadData);

  const { from, to } = defaultDates();
  document.getElementById("fromDate").value = from;
  document.getElementById("toDate").value = to;

  loadData();
}

main();
</script>
</body>
</html>
