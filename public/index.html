<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÁFA-monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4fb; --surface: #ffffff; --ink: #1a1b2e; --ink-soft: #6b7089;
    --line: #eaeaf3; --primary: #4f46e5; --ok: #16a34a; --ok-soft: #f0fdf4;
    --shadow: 0 1px 2px rgba(23,23,60,0.04), 0 6px 20px rgba(23,23,60,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { max-width: 420px; width: 100%; padding: 1.25rem; text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--primary), #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; margin: 0 auto 1.2rem; }
  .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 2rem 1.6rem; }
  h1 { font-size: 1.25rem; margin: 0 0 0.6rem; }
  p { font-size: 0.9rem; color: var(--ink-soft); line-height: 1.6; margin: 0 0 1.4rem; }
  .icon-ok { font-size: 2rem; margin-bottom: 0.8rem; }
  a.btn {
    display: inline-block; background: var(--primary); color: #fff; text-decoration: none;
    padding: 0.7rem 1.6rem; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
  }
  a.btn:hover { background: #4338ca; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">💶</div>
    <div class="card">
      <div class="icon-ok">✅</div>
      <h1>Email cím megerősítve</h1>
      <p>Köszönjük, a fiókod aktív! Az adataidat hamarosan átnézzük és aktiváljuk a szolgáltatást — erről külön értesítünk.</p>
      <a class="btn" href="login.html">Bejelentkezés</a>
    </div>
  </div>
</body>
</html>
