<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bejelentkezés — ÁFA-monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4fb; --surface: #ffffff; --ink: #1a1b2e; --ink-soft: #6b7089;
    --line: #eaeaf3; --primary: #4f46e5; --primary-soft: #eef0fe;
    --danger: #dc2626; --danger-soft: #fef2f2; --ok: #16a34a; --ok-soft: #f0fdf4;
    --shadow: 0 1px 2px rgba(23,23,60,0.04), 0 6px 20px rgba(23,23,60,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { max-width: 400px; width: 100%; padding: 1.25rem; }
  .masthead { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1.5rem; justify-content: center; }
  .masthead .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--primary), #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 1.15rem; }
  .masthead .title { font-size: 1.05rem; font-weight: 700; }

  .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 1.8rem 1.6rem; }
  label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; margin-top: 0.9rem; }
  label:first-of-type { margin-top: 0; }
  input[type="email"], input[type="password"] {
    width: 100%; font-family: "Inter", sans-serif; font-size: 0.9rem; padding: 0.6rem 0.75rem;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fafafe; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--primary); }

  .submit-btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 0.8rem; font-size: 0.92rem; font-weight: 700; cursor: pointer; margin-top: 1.2rem; }
  .submit-btn:hover { background: #4338ca; }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .forgot-link { text-align: center; margin-top: 0.9rem; }
  .forgot-link button { background: none; border: none; color: var(--primary); font-size: 0.82rem; font-weight: 600; cursor: pointer; text-decoration: underline; }

  .status { display: none; border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.84rem; margin-bottom: 1.1rem; line-height: 1.5; }
  .status.error { display: block; background: var(--danger-soft); color: #991b1b; }
  .status.success { display: block; background: var(--ok-soft); color: #166534; }

  .register-link { text-align: center; font-size: 0.85rem; color: var(--ink-soft); margin-top: 1.2rem; }
  .register-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <div class="logo">💶</div>
      <div class="title">ÁFA-monitor</div>
    </div>

    <div class="card">
      <div id="statusBox" class="status"></div>

      <form id="loginForm">
        <label>Email cím</label>
        <input type="email" id="email" required>
        <label>Jelszó</label>
        <input type="password" id="password" required>
        <button type="submit" class="submit-btn" id="submitBtn">Bejelentkezés</button>
      </form>

      <div class="forgot-link"><button id="forgotBtn">Elfelejtett jelszó</button></div>
    </div>

    <div class="register-link">Még nincs fiókod? <a href="register.html">Regisztrálj</a></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showStatus(message, type) {
  const box = document.getElementById("statusBox");
  box.textContent = message;
  box.className = "status " + type;
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Bejelentkezés...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    showStatus("Hiba: " + error.message, "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Bejelentkezés";
    return;
  }

  showStatus("Sikeres bejelentkezés! (A saját, élő dashboard-nézet fejlesztés alatt áll — egyelőre az adataidat a szolgáltató kezeli és küldi el neked.)", "success");
});

document.getElementById("forgotBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) {
    showStatus("Először írd be az email címed a mezőbe, utána kattints ide.", "error");
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname.replace("login.html", "reset-password.html"),
  });
  if (error) {
    showStatus("Hiba: " + error.message, "error");
  } else {
    showStatus("Ha ez az email cím regisztrálva van nálunk, elküldtük a jelszó-visszaállító linket — nézd meg a postaládád.", "success");
  }
});
</script>
</body>
</html>
