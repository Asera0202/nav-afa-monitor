name: Regisztrációk automatikus aktiválása

# ÚJRA BEKAPCSOLVA (2026.11.12): a src/auto-approve-registrations.ts
# mostantól csak olyan regisztrációt aktivál, ahol a felhasználó
# TÉNYLEGESEN megerősítette az email-címét (korábban ezt nem
# ellenőriztük, ezért tudott 18 hamis "céget" létrehozni egy
# bot-roham). Emellett ajánlott még CAPTCHA-t is bekapcsolni a
# regisztrációs oldalakon (Supabase Authentication → Attack Protection).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Repó kicsomagolása
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Függőségek telepítése
        run: npm ci

      - name: Regisztrációk aktiválása
        run: npx tsx src/auto-approve-registrations.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
