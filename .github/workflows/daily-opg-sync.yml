name: Napi NAV-szinkron (számlák + pénztárgép)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repó kicsomagolása
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Függőségek telepítése
        run: npm ci

      - name: Napi OPG (pénztárgép) szinkron futtatása
        run: npx tsx src/daily-opg-sync.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGISTRATION_PRIVATE_KEY: ${{ secrets.REGISTRATION_PRIVATE_KEY }}
          SOFTWARE_NAME: Cégfókusz
          SOFTWARE_DEV_NAME: ${{ secrets.SOFTWARE_DEV_NAME }}
          SOFTWARE_DEV_CONTACT: ${{ secrets.SOFTWARE_DEV_CONTACT }}

      - name: Napi számla (bejövő + kimenő) szinkron futtatása
        run: npx tsx src/daily-invoice-sync.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGISTRATION_PRIVATE_KEY: ${{ secrets.REGISTRATION_PRIVATE_KEY }}
          SOFTWARE_NAME: Cégfókusz
          SOFTWARE_DEV_NAME: ${{ secrets.SOFTWARE_DEV_NAME }}
          SOFTWARE_DEV_CONTACT: ${{ secrets.SOFTWARE_DEV_CONTACT }}

      - name: Állapot-oldal generálása
        run: npx tsx src/generate-status-page.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}

      - name: Bevételi küszöb-jelentés generálása
        run: npx tsx src/generate-threshold-report.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Eredmény commitolása
        run: |
          git config user.name "cegfokusz-bot"
          git config user.email "cegfokusz-bot@users.noreply.github.com"
          git add public/status.html public/thresholds.html
          git diff --cached --quiet || git commit -m "Napi NAV-szinkron + állapot-frissítés: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
