name: Havi összefoglaló email

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch: {}

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Repó kicsomagolása
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Függőségek telepítése
        run: npm ci

      - name: Havi összefoglaló emailek küldése
        run: npx tsx src/monthly-summary-email.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_PASS: ${{ secrets.BREVO_SMTP_PASS }}
